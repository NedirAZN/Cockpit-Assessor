<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cockpit de Carteiras — BFR</title>
<style>
:root{
  --bg:#0B1220; --panel:#111B2E; --panel2:#16233B; --line:#1F2E48;
  --txt:#E6EDF7; --mut:#8FA3C0; --dim:#5B6E8C;
  --gold:#F5C044; --green:#3DDC97; --red:#FF6B6B; --sky:#5AB8F5; --violet:#A78BFA; --orange:#FB923C;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:14px}
.wrap{max-width:1320px;margin:0 auto;padding:20px}
header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:18px}
h1{font-size:20px;letter-spacing:-.02em}
h1 span{color:var(--gold)}
.sub{color:var(--mut);font-size:12px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
.tab{padding:8px 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--mut);cursor:pointer;font-size:13px;font-weight:500}
.tab.on{background:rgba(245,192,68,.12);border-color:rgba(245,192,68,.4);color:var(--gold)}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:1.1fr .9fr}
.g2e{grid-template-columns:1fr 1fr}
@media(max-width:900px){.g4{grid-template-columns:repeat(2,1fr)}.g3,.g2,.g2e{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
.kpi .lbl{color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
.kpi .val{font-size:22px;font-weight:700;letter-spacing:-.02em}
.kpi .det{font-size:11px;color:var(--dim);margin-top:4px}
.sec{font-size:13px;font-weight:600;color:var(--mut);margin-bottom:12px;text-transform:uppercase;letter-spacing:.05em}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.04em;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:9px 10px;border-bottom:1px solid rgba(31,46,72,.5)}
tr.click{cursor:pointer}
tr.click:hover td{background:rgba(90,184,245,.05)}
.r{text-align:right}
th.r{text-align:right}
.pos{color:var(--green)}.neg{color:var(--red)}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11px;font-weight:600}
.pill.gold{background:rgba(245,192,68,.14);color:var(--gold)}
.pill.green{background:rgba(61,220,151,.14);color:var(--green)}
.pill.red{background:rgba(255,107,107,.14);color:var(--red)}
.pill.sky{background:rgba(90,184,245,.14);color:var(--sky)}
.pill.violet{background:rgba(167,139,250,.14);color:var(--violet)}
.pill.orange{background:rgba(251,146,60,.16);color:var(--orange)}
.pill.mut{background:rgba(143,163,192,.12);color:var(--mut)}
.bar{height:8px;border-radius:6px;background:var(--panel2);overflow:hidden;margin-top:4px}
.bar>i{display:block;height:100%;border-radius:6px}
.leg{display:flex;align-items:center;justify-content:space-between;font-size:12px;margin-top:8px}
.leg .nm{display:flex;align-items:center;gap:7px;color:var(--txt)}
.dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.opcard{border-left:3px solid var(--gold);padding:14px 16px;background:var(--panel);border-radius:0 12px 12px 0;border-top:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:10px;cursor:pointer}
.opcard:hover{background:var(--panel2)}
.opcard .t{font-weight:600;margin-bottom:3px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.opcard .d{color:var(--mut);font-size:12.5px;line-height:1.5}
.opcard .m{color:var(--dim);font-size:11px;margin-top:5px}
.prod{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--panel2);margin-bottom:8px}
.prod .pt{font-weight:700;display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:4px}
.prod .pd{color:var(--mut);font-size:12.5px;line-height:1.5}
.search{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px;color:var(--txt);font-size:14px;margin-bottom:14px;outline:none}
.search:focus{border-color:rgba(245,192,68,.5)}
.donut{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.back{color:var(--sky);cursor:pointer;font-size:13px;margin-bottom:12px;display:inline-block}
.hint{color:var(--dim);font-size:12px;margin-top:10px;line-height:1.5}
.flagrow{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{padding:6px 12px;border-radius:99px;border:1px solid var(--line);background:var(--panel);font-size:12px;color:var(--mut);cursor:pointer}
.chip.on{border-color:rgba(245,192,68,.5);color:var(--gold)}
.mt{margin-top:14px}
.cp{opacity:0;background:var(--panel2);border:1px solid var(--line);color:var(--mut);border-radius:6px;padding:1px 7px;font-size:10px;cursor:pointer;margin-left:6px;transition:opacity .15s;vertical-align:middle}
tr:hover .cp,.opcard:hover .cp{opacity:1}
.cp:hover{color:var(--gold);border-color:rgba(245,192,68,.5)}
.binput{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;color:var(--txt);font-size:13px;outline:none;width:100%}
.binput:focus{border-color:rgba(245,192,68,.5)}
.bform{display:grid;grid-template-columns:110px 110px 1fr 1fr 120px 110px auto;gap:8px;align-items:end}
@media(max-width:1000px){.bform{grid-template-columns:1fr 1fr;}}
.blbl{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
.del{background:none;border:none;color:var(--dim);cursor:pointer;font-size:14px}
.aviso{border-radius:14px;padding:16px 18px;margin-bottom:14px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;border:1px solid}
.aviso.atrasado{background:rgba(255,107,107,.09);border-color:rgba(255,107,107,.4)}
.aviso.janela{background:rgba(245,192,68,.09);border-color:rgba(245,192,68,.4)}
.aviso.proximo{background:rgba(90,184,245,.07);border-color:rgba(90,184,245,.3)}
.aviso .ic{font-size:26px;line-height:1}
.aviso .tt{font-weight:700;font-size:14px;margin-bottom:3px}
.aviso .ds{font-size:12.5px;color:var(--mut);line-height:1.55}
.selo{display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:4px 10px;border-radius:99px;border:1px solid var(--line);background:var(--panel2);cursor:pointer}
#chatbtn{position:fixed;right:22px;bottom:22px;width:54px;height:54px;border-radius:50%;background:var(--gold);color:#0B1220;border:none;font-size:22px;cursor:pointer;box-shadow:0 6px 20px rgba(0,0,0,.45);z-index:90}
#chatbox{position:fixed;right:22px;bottom:86px;width:400px;max-width:calc(100vw - 44px);height:520px;max-height:calc(100vh - 120px);background:var(--panel);border:1px solid var(--line);border-radius:16px;display:none;flex-direction:column;z-index:91;box-shadow:0 12px 40px rgba(0,0,0,.55);overflow:hidden}
#chathead{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
#chatlog{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:88%;padding:9px 12px;border-radius:12px;font-size:12.5px;line-height:1.55;white-space:pre-wrap}
.msg.u{align-self:flex-end;background:var(--gold);color:#0B1220;font-weight:500}
.msg.a{align-self:flex-start;background:var(--panel2);border:1px solid var(--line)}
.msg.a b{color:var(--gold)}
#chatin{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line)}
#chatin input{flex:1;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:9px 12px;color:var(--txt);font-size:13px;outline:none}
.sug{display:flex;gap:6px;flex-wrap:wrap;padding:0 10px 10px}
.sug span{font-size:10.5px;background:var(--panel2);border:1px solid var(--line);color:var(--mut);border-radius:99px;padding:4px 9px;cursor:pointer}
.sug span:hover{color:var(--gold);border-color:rgba(245,192,68,.5)}
.del:hover{color:var(--red)}
.empty{color:var(--dim);text-align:center;padding:30px 0}
.expand{background:var(--panel2);border-radius:10px;padding:12px;margin:4px 0 10px}
.meta-prog{height:10px;border-radius:6px;background:var(--panel2);overflow:hidden;margin-top:6px}
.meta-prog>i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--green))}

/* ===== SIMULAÇÃO DE CARTEIRA (escopado em #simroot) ===== */
#simroot{--snavy:#0B1A2E;--snavy2:#12243D;--snavy3:#182F4E;--sline:#24405f;--sgold:#C9A227;--sgoldsoft:#E0C158;--sink:#EAF0F7;--sinkdim:#9DB0C6;--scdi:#2E9E5B;--sipca:#E8873A;--spre:#3B82D6;--srv:#C9A227;--sok:#2E9E5B;--swarn:#E0A23A;--sbad:#D9534F;}#simroot{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--snavy);color:var(--sink);padding:22px 18px 60px;line-height:1.4}#simroot .wrap{max-width:1120px;margin:0 auto}#simroot header.top{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid var(--sgold);padding-bottom:14px;flex-wrap:wrap;gap:14px}#simroot .brand .kicker{letter-spacing:.28em;font-size:11px;color:var(--sgold);font-weight:700;text-transform:uppercase}#simroot .brand h1{font-size:23px;font-weight:800;letter-spacing:-.01em}#simroot .brand .sub{color:var(--sinkdim);font-size:13px}#simroot .totbox{text-align:right}#simroot .totbox .lbl{font-size:11px;color:var(--sinkdim);text-transform:uppercase;letter-spacing:.14em}#simroot .totbox .tin{background:transparent;border:none;border-bottom:1px dashed var(--sline);color:var(--sgoldsoft);font-size:23px;font-weight:800;text-align:right;width:200px;font-family:inherit}#simroot .totbox .tin:focus{outline:none;border-bottom-color:var(--sgold)}#simroot .master{display:flex;align-items:center;gap:14px;margin:14px 0 18px;background:var(--snavy2);border:1px solid var(--sline);border-radius:12px;padding:9px 16px;flex-wrap:wrap}#simroot .master .segbar{flex:1;min-width:220px;height:18px;border-radius:6px;overflow:hidden;display:flex;background:#0d1c30}#simroot .master .seg{height:100%}#simroot .master .status{font-size:13px;font-weight:700;white-space:nowrap}#simroot .status.ok{color:var(--sok)}#simroot .status.bad{color:var(--swarn)}#simroot .tabs{display:flex;gap:6px;margin-bottom:20px;background:var(--snavy2);border:1px solid var(--sline);border-radius:12px;padding:6px;flex-wrap:wrap}#simroot .tab{flex:1;min-width:130px;text-align:center;padding:11px;border-radius:8px;cursor:pointer;font-size:14px;font-weight:700;color:var(--sinkdim);user-select:none}#simroot .tab:hover{color:var(--sink)}#simroot .tab.active{background:var(--sgold);color:#0B1A2E}#simroot .panel{display:none}#simroot .panel.active{display:block}#simroot .hintbar{background:var(--snavy2);border:1px solid var(--sline);border-left:4px solid var(--sgold);border-radius:10px;padding:11px 15px;font-size:12.5px;color:var(--sinkdim);margin-bottom:16px}#simroot .hintbar b{color:var(--sink)}#simroot .clsblock{margin-bottom:20px;background:var(--snavy2);border:1px solid var(--sline);border-radius:14px;overflow:hidden}#simroot .clsblock .h{display:flex;align-items:center;justify-content:space-between;border-left:6px solid var(--sline);padding:11px 16px;flex-wrap:wrap;gap:8px}#simroot .clsblock .h .nmret{display:flex;align-items:center;gap:12px;flex-wrap:wrap}#simroot .clsblock .h b{font-size:16px}#simroot .retwrap{display:flex;align-items:center;gap:3px;font-size:11px;color:var(--sinkdim)}#simroot .retin{width:46px;background:#0d1c30;border:1px solid var(--sline);border-radius:5px;color:var(--sgoldsoft);font-weight:700;text-align:right;font-family:inherit;font-size:12px;padding:3px 5px}#simroot .retin:focus{outline:none;border-color:var(--sgold)}#simroot .clsblock .meta{font-size:12px;color:var(--sinkdim);display:flex;align-items:center;gap:8px}#simroot .badge{font-size:10px;font-weight:800;padding:2px 8px;border-radius:20px;text-transform:uppercase}#simroot .badge.ok{background:rgba(46,158,91,.18);color:#5fd18c}#simroot .badge.warn{background:rgba(224,162,58,.18);color:#f0c473}#simroot .badge.res{background:rgba(201,162,39,.2);color:var(--sgoldsoft)}#simroot .rows{padding:6px 14px 10px}#simroot .ir{padding:11px 4px;border-bottom:1px solid rgba(36,64,95,.5)}#simroot .ir:last-child{border-bottom:none}#simroot .ir-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:7px}#simroot .nm{flex:1;min-width:120px;background:transparent;border:none;border-bottom:1px solid transparent;color:var(--sink);font-size:14px;font-weight:600;font-family:inherit;padding:2px}#simroot .nm.open{color:var(--sinkdim);font-style:italic;font-weight:500}#simroot .nm:focus{outline:none;border-bottom-color:var(--sgold);color:var(--sink);font-style:normal}#simroot .ir-right{display:flex;align-items:center;gap:10px;white-space:nowrap}#simroot .pctwrap{display:flex;align-items:center;gap:2px;background:#0d1c30;border:1px solid var(--sline);border-radius:7px;padding:3px 7px}#simroot .pctwrap input{width:48px;background:transparent;border:none;color:var(--sink);font-size:14px;font-weight:700;text-align:right;font-family:inherit}#simroot .pctwrap input:focus{outline:none}#simroot .pctwrap .u{color:var(--sinkdim);font-size:12px}#simroot .val{font-size:13px;font-weight:700;color:var(--sgoldsoft);min-width:104px;text-align:right;font-variant-numeric:tabular-nums}#simroot .del{background:transparent;border:none;cursor:pointer;color:#7089a5;font-size:15px;border-radius:6px;padding:2px 5px}#simroot .del:hover{color:var(--sbad);background:rgba(217,83,79,.12)}#simroot .addslot{margin:4px 4px 2px;background:transparent;border:1px dashed var(--sline);color:var(--sinkdim);border-radius:8px;padding:9px;width:100%;cursor:pointer;font-size:12px;font-weight:600;font-family:inherit}#simroot .addslot:hover{border-color:var(--sgold);color:var(--sgoldsoft)}#simroot .emptycls{padding:14px;color:var(--sinkdim);font-size:12.5px;font-style:italic}#simroot /* comparativo */
  .cmpcls{background:var(--snavy2);border:1px solid var(--sline);border-radius:14px;padding:16px;margin-bottom:16px}#simroot .cmpcls .ch{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}#simroot .cmpcls .ch b{font-size:15px}#simroot .cmprow{display:grid;grid-template-columns:70px 1fr;gap:10px;align-items:center;margin-bottom:8px}#simroot .cmprow .lb{font-size:11px;color:var(--sinkdim);text-transform:uppercase;letter-spacing:.05em}#simroot .cbar{height:22px;background:#0d1c30;border-radius:6px;position:relative;overflow:hidden}#simroot .cbar>i{position:absolute;left:0;top:0;bottom:0;border-radius:6px}#simroot .cbar>span{position:absolute;right:8px;top:0;bottom:0;display:flex;align-items:center;font-size:12px;font-weight:700;color:#fff}#simroot table.mov{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}#simroot table.mov th{text-align:right;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--sinkdim);padding:8px;border-bottom:1.5px solid var(--sline)}#simroot table.mov th:first-child{text-align:left}#simroot table.mov td{text-align:right;padding:8px;border-bottom:1px solid rgba(36,64,95,.5);font-variant-numeric:tabular-nums}#simroot table.mov td:first-child{text-align:left;font-weight:700}#simroot .tag{font-size:10px;font-weight:800;padding:2px 9px;border-radius:20px;text-transform:uppercase}#simroot .tag.buy{background:rgba(46,158,91,.18);color:#5fd18c}#simroot .tag.sell{background:rgba(217,83,79,.18);color:#eb8f8c}#simroot .tag.keep{background:rgba(157,176,198,.15);color:var(--sinkdim)}#simroot .twocol{display:grid;grid-template-columns:1fr 1fr;gap:16px}#simroot table.projtbl{width:100%;border-collapse:collapse;font-size:13px;margin-top:4px}#simroot table.projtbl th{text-align:right;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--sinkdim);padding:8px;border-bottom:1.5px solid var(--sline)}#simroot table.projtbl th:first-child{text-align:left}#simroot table.projtbl td{text-align:right;padding:7px 8px;border-bottom:1px solid rgba(36,64,95,.4);font-variant-numeric:tabular-nums}#simroot table.projtbl td:first-child{text-align:left}#simroot table.projtbl td.r,#simroot table.projtbl th.r{text-align:right}#simroot table.projtbl tbody tr:hover{background:rgba(255,255,255,.02)}#simroot table.projtbl tfoot td{border-top:1.5px solid var(--sline);border-bottom:none;padding-top:10px;background:rgba(201,162,39,.06)}
  @media(max-width:720px){#simroot .twocol{grid-template-columns:1fr}}#simroot .lst{background:var(--snavy2);border:1px solid var(--sline);border-radius:12px;padding:14px}#simroot .lst h4{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--sgold);margin-bottom:10px}#simroot .lst .li{display:flex;justify-content:space-between;font-size:13px;padding:6px 0;border-bottom:1px solid rgba(36,64,95,.4)}#simroot .lst .li:last-child{border-bottom:none}#simroot .lst .li .n{color:var(--sink)}#simroot .lst .li .v{color:var(--sgoldsoft);font-weight:700;font-variant-numeric:tabular-nums}#simroot /* projection */
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:20px}#simroot .kpi{background:var(--snavy2);border:1px solid var(--sline);border-radius:12px;padding:14px 16px}#simroot .kpi .k{font-size:11px;color:var(--sinkdim);text-transform:uppercase;letter-spacing:.1em}#simroot .kpi .v{font-size:21px;font-weight:800;margin-top:4px}#simroot .kpi .d{font-size:11px;color:var(--sinkdim);margin-top:2px}#simroot .card{background:var(--snavy2);border:1px solid var(--sline);border-radius:14px;padding:18px}#simroot .card h3{font-size:13px;text-transform:uppercase;letter-spacing:.12em;color:var(--sgold);margin-bottom:14px;font-weight:700}#simroot .inrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:8px}#simroot .field{background:var(--snavy2);border:1px solid var(--sline);border-radius:10px;padding:10px 12px}#simroot .field label{display:block;font-size:11px;color:var(--sinkdim);text-transform:uppercase;letter-spacing:.08em;margin-bottom:5px}#simroot .field input{width:100%;background:#0d1c30;border:1px solid var(--sline);border-radius:7px;color:var(--sink);font-size:15px;font-weight:700;font-family:inherit;padding:7px 9px}#simroot .field input:focus{outline:none;border-color:var(--sgold)}#simroot .field.calc input{background:transparent;border:none;color:var(--sgoldsoft);padding-left:0}#simroot .dot{width:11px;height:11px;border-radius:3px;display:inline-block}#simroot .foot{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap}#simroot button.act{background:var(--snavy3);border:1px solid var(--sline);color:var(--sink);border-radius:9px;padding:10px 15px;cursor:pointer;font-size:13px;font-weight:600;font-family:inherit}#simroot button.act:hover{border-color:var(--sgold)}#simroot button.act.gold{background:var(--sgold);color:#0B1A2E;border-color:var(--sgold);font-weight:800}#simroot .note{margin-top:18px;background:var(--snavy2);border:1px solid var(--sline);border-left:4px solid var(--sgold);border-radius:10px;padding:13px 16px;font-size:12.5px;color:var(--sinkdim)}#simroot .note b{color:var(--sink)}#simroot svg text{font-family:'Segoe UI',sans-serif}

</head>
<body>
<div class="wrap">
<header>
  <div>
    <h1>Cockpit de <span>Carteiras</span> · BFR</h1>
    <div class="sub" id="subinfo"></div>
  </div>
  <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
    <span class="selo" id="relogio_vivo" title="Data e hora atual — atualiza ao vivo" style="cursor:default"></span>
    <span class="selo" id="selo_atu" onclick="tab='cons';render('cons');window.scrollTo(0,0)"></span>
    <button onclick="exportarBackup()" title="Salvar boletas, notas, demandas e produtos num arquivo" style="background:var(--panel2);border:1px solid var(--line);color:var(--mut);border-radius:8px;padding:6px 12px;font-size:11.5px;cursor:pointer">⬇ Backup</button>
    <label style="background:var(--panel2);border:1px solid var(--line);color:var(--mut);border-radius:8px;padding:6px 12px;font-size:11.5px;cursor:pointer">⬆ Restaurar
      <input type="file" accept="application/json" style="display:none" onchange="importarBackup(this)">
    </label>
  </div>

// ---- Dividendos/proventos recebidos (lidos das movimentações do XPerformance) ----
// A versão anterior procurava "JUROS S/CAP" sem espaço e "RENDIMENTOS DE CLIENTES"
// no plural, e exigia um ticker tipo XPAG11. Isso deixava invisível quase 80% dos
// proventos da base: fundo fechado paga como "RENDIMENTO FUNDO FECHADO BALCÃO
// <nome do fundo>", sem ticker; o extrato escreve "JUROS S/ CAPITAL" com espaço;
// aluguel de ações vem como "CRÉDITO REF. TAXA DE REMUNERAÇÃO BTC"; e cupom de
// COE e NTN-B vem como "PGTO JUROS" ou "CUPOM".
const _RX_TICKER   = /\b([A-Z]{4}\d{1,2})\b/;
const _RX_PROVENTO = /(DIVIDENDO|RENDIMENTO|JUROS\s*S\/?\s*CAP|JRS\s*CAP|\bJCP\b|REMUNERA[ÇC][ÃA]O\s+BTC|ALUGUEL\s+DE\s+A[ÇC][ÕO]ES|PGTO\s+JUROS|CUPOM)/;
// Tudo que contém dinheiro entrando mas NÃO é renda do ativo: imposto retido,
// estorno, reembolso, ajuste de day trade, liquidação, TED, amortização de
// principal. Amortização sai de propósito — é devolução de capital, não renda,
// e inflaria a conta de renda recorrente.
const _RX_NAO_PROV  = /(IRRF|D[ÉE]BITO|DEBITO|TAXA DE INTERMEDIA|TAXA DE PERMAN|ESTORNO|REEMBOLSO|AJUSTE|OPERA[ÇC][ÕO]ES EM BOLSA|LIQUIDA[ÇC]|TED\b|TRANSFER|AMORTIZA|RESGATE|COMPRA|VENDA|SUBSCRI|CHAMADA DE MARGEM|INVESTBACK)/;

function _ativoProvento(h){
  const t=h.match(_RX_TICKER); if(t) return t[1];
  let m=h.match(/BALC[ÃA]O\s+(.+)$/);                          if(m) return m[1].trim().slice(0,30);
  m=h.match(/DE\s+CLIENTES\s+(.+?)(?:\s+S\/\s*[\d.]+)?$/);      if(m) return m[1].trim().slice(0,30);
  m=h.match(/BTC\s+([A-Z0-9]+)/);                              if(m) return m[1];
  m=h.match(/\|\s*(.+)$/);                                     if(m) return m[1].trim().slice(0,30);
  return h.trim().slice(0,30);
}

function dividendosDe(c){
  const porAtivo={}; let total=0;
  (c.movimentacoes||[]).forEach(m=>{
    const h=(m.historico||"").toUpperCase(); const v=m.valor||0;
    if(v<=0) return;
    if(_RX_NAO_PROV.test(h)) return;
    if(!_RX_PROVENTO.test(h)) return;
    const tk=_ativoProvento(h);
    porAtivo[tk]=(porAtivo[tk]||0)+v; total+=v;
  });
  const ativos=Object.entries(porAtivo).map(([ativo,valor])=>({ativo,valor})).sort((a,b)=>b.valor-a.valor);
  return {total, ativos, n:ativos.length};
}

// ---------- CONTROLE DE ATUALIZAÇÃO DOS RELATÓRIOS ----------
// Abastecimento manual quinzenal: janela no dia 5 e no dia 20 de cada mês.
// Os relatórios da XP são D-5, então o lote do dia 5 traz posições até o dia 1º.
const AKEY = "bfr_atualizacao_v1";
const DIAS_JANELA = [5, 20];
let ATU = { ultima:null, ref:null, historico:[] };
try{ const s=localStorage.getItem(AKEY); if(s) ATU=JSON.parse(s); }catch(e){}

function statusAtualizacao(){
  const hoje = new Date();
  const dia = hoje.getDate();
  const ymd = d => d.toISOString().slice(0,10);

  // janela vigente: a última data-alvo que já passou
  let alvo = new Date(hoje.getFullYear(), hoje.getMonth(), DIAS_JANELA[0]);
  if(dia >= DIAS_JANELA[1]) alvo = new Date(hoje.getFullYear(), hoje.getMonth(), DIAS_JANELA[1]);
  else if(dia < DIAS_JANELA[0]) alvo = new Date(hoje.getFullYear(), hoje.getMonth()-1, DIAS_JANELA[1]);

  // próxima janela
  let prox;
  if(dia < DIAS_JANELA[0]) prox = new Date(hoje.getFullYear(), hoje.getMonth(), DIAS_JANELA[0]);
  else if(dia < DIAS_JANELA[1]) prox = new Date(hoje.getFullYear(), hoje.getMonth(), DIAS_JANELA[1]);
  else prox = new Date(hoje.getFullYear(), hoje.getMonth()+1, DIAS_JANELA[0]);

  const ultima = ATU.ultima ? new Date(ATU.ultima+"T12:00:00") : null;
  const diasDesde = ultima ? Math.floor((hoje-ultima)/86400000) : null;
  const pendente = !ultima || ultima < alvo;              // a janela vigente ainda não foi atendida
  const diasAtraso = pendente ? Math.floor((hoje-alvo)/86400000) : 0;
  const faltamProx = Math.ceil((prox-hoje)/86400000);

  let nivel = "ok";
  if(pendente && diasAtraso >= 3) nivel = "atrasado";
  else if(pendente) nivel = "janela";
  else if(faltamProx <= 2) nivel = "proximo";

  return { nivel, pendente, diasDesde, diasAtraso, faltamProx,
           alvo: ymd(alvo), prox: ymd(prox), ultima: ATU.ultima, ref: ATU.ref };
}

// atingimento do IEA a partir dos KPIs informados
function calcIEA(){
  const g = {};
  IEA_KPIS.forEach(k=>{
    const d = MET.iea[k.id] || {};
    const padrao = d.padrao || 0, real = d.real || 0;
    const at = padrao>0 ? Math.min(real/padrao*100, 150) : 0;
    (g[k.grupo] ||= { soma:0, peso:0, itens:[] });
    g[k.grupo].soma += at * (k.peso/100);
    g[k.grupo].peso += k.peso;
    g[k.grupo].itens.push({ ...k, padrao, real, at });
  });
  const prosp = g["Prospecção"]?.soma || 0;
  const relac = g["Relacionamento"]?.soma || 0;
  return { total: Math.min(prosp*0.5 + relac*0.5, 150), prospeccao: prosp, relacionamento: relac, grupos: g };
}

// realizado de cada meta, puxando os dados que o cockpit já tem
function realizadoMetas(){
  const capT = contas.reduce((a,c)=>{ const x=captacaoDe(c); a.e+=x.entrada; a.s+=x.saida; return a; },{e:0,s:0});
  const iea = calcIEA();
  const npsNotas = MET.nps.map(x=>x.nota).filter(n=>n!=null);
  const promotores = npsNotas.filter(n=>n>=9).length;
  const detratores = npsNotas.filter(n=>n<=6).length;
  const npsScore = npsNotas.length ? Math.round((promotores-detratores)/npsNotas.length*100) : null;
  const transf = totalTransf();
  const aportes = capT.e - capT.s;
  const capManual = (MET.captacaoManual!=null && MET.captacaoManual!=="") ? Number(MET.captacaoManual) : null;
  const capReal = capManual!=null ? capManual : (aportes + transf);
  return {
    captacao: { real: capReal, manual: capManual, calculado: aportes + transf,
                entradas: capT.e, saidas: capT.s,
                aportes, transferencias: transf,
                nTransf: (MET.transf||[]).length },
    receita:  { real: receitaRealizada() },
    iea:      { real: iea.total, detalhe: iea },
    seguros:  { real: MET.seguros.filter(s=>!s.cancelado).length, lista: MET.seguros },
    nps:      { real: npsScore, respostas: npsNotas.length, promotores, detratores },
  };
}
function atingimentoGeral(){
  const R = realizadoMetas();
  const linhas = Object.entries(MET.metas).map(([k,m])=>{
    const real = R[k].real;
    let at;
    if(m.binaria){
      at = (real!=null && real>=m.meta) ? 100 : 0;              // tudo ou nada
    } else {
      at = (m.meta>0 && real!=null) ? Math.max(real/m.meta*100, 0) : 0;  // sem teto: excedente soma
    }
    const prog = Math.min(at, 100);                              // barra até 100%
    const pontos = at*(m.peso/100);                              // pontos conquistados
    return { id:k, ...m, real, at, prog, pontos, contrib: pontos };
  });
  return { linhas, total: linhas.reduce((s,l)=>s+l.contrib,0), R };
}

// ---------- POLÍTICA DE SLOTS (gerenciamento de risco) ----------
// Posições de risco entram por slot de 3–5% do patrimônio, estendendo até 8% em casos específicos.
const SLOT = {min:0.03, alvo:0.05, ext:0.08};
const TETO_PACOTE = 0.25;   // teto total de novas alocações num mesmo pacote

// dimensiona a alocação de um produto respeitando slot, folga de caixa e teto do pacote
function dimensiona(c, prodId, orcamentoRestante){
  const p = c.patrimonio||0;
  const prod = PRODUTOS.find(x=>x.id===prodId);
  if(!p||!prod) return {min:0,max:0,sugerido:0};
  // exposição já existente no mesmo tema (evita dobrar)
  let jaTem = 0;
  if(prodId==="gld") jaTem = c.posicoes.filter(x=>ehCOE(x.ativo)&&subtipoCOE(x.ativo)==="Ouro").reduce((s,x)=>s+(x.saldo||0),0);
  const tetoSlot = Math.max(p*SLOT.alvo - jaTem, 0);
  const minSlot  = Math.max(p*SLOT.min - jaTem, 0);
  const sugerido = Math.min(tetoSlot, Math.max(orcamentoRestante,0));
  return {min:Math.min(minSlot,sugerido), max:tetoSlot, sugerido, jaTem};
}

// ---------- pacotes por cliente (esteira) ----------
function pacoteDe(c){
  const P = c.patrimonio||0;
  // orçamento: folga de caixa quando conhecida, senão teto do pacote
  const L = liqDe(c);
  const fonte = (L.folga!=null && L.folga>0) ? L.folga : (L.liquido>0 ? L.liquido*0.6 : P*TETO_PACOTE);
  let orcamento = Math.min(fonte, P*TETO_PACOTE);
  // ordena por ROA (maior receita primeiro) e distribui slots sem repetir orçamento
  const ids = [...new Set(c.flags.flatMap(f=>f.prods))]
    .filter(id=>PRODUTOS.find(x=>x.id===id))
    .sort((a,b)=>roaDe(PRODUTOS.find(x=>x.id===b))-roaDe(PRODUTOS.find(x=>x.id===a)));
  const itens=[];
  ids.forEach(pid=>{
    const prod = PRODUTOS.find(x=>x.id===pid);
    const d = dimensiona(c, pid, orcamento);
    if(d.sugerido < P*0.01) return;              // slot irrelevante, descarta
    orcamento -= d.sugerido;                      // consome o orçamento
    const motivo = (c.flags.find(f=>f.prods.includes(pid))||{}).tag || "";
    itens.push({p:prod, valor:d.sugerido, min:d.min, max:d.max, jaTem:d.jaTem||0,
                pctSlot: P? d.sugerido/P*100 : 0, receita:d.sugerido*roaDe(prod)/100, motivo});
  });
  const valor = itens.reduce((s,x)=>s+x.valor,0);
  return {itens, receita: itens.reduce((s,x)=>s+x.receita,0), valor,
          pctCarteira: P? valor/P*100 : 0, orcamentoInicial: Math.min(fonte,P*TETO_PACOTE),
          sinais: [...new Set(c.flags.filter(f=>!f.gld).map(f=>f.tag))]};
}
function clientesDoProduto(pid){
  const prod = PRODUTOS.find(x=>x.id===pid);
  return contas.filter(c=>c.flags.some(f=>f.prods.includes(pid)))
    .map(c=>{
      const f = c.flags.find(x=>x.prods.includes(pid));
      const it = pacoteDe(c).itens.find(x=>x.p.id===pid);
      const valor = it? it.valor : Math.min(c.patrimonio*SLOT.alvo, c.patrimonio*SLOT.alvo);
      return {c, valor, min: it?it.min:c.patrimonio*SLOT.min, max: it?it.max:c.patrimonio*SLOT.alvo,
              pctSlot: c.patrimonio? valor/c.patrimonio*100:0,
              receita: valor*roaDe(prod)/100, motivo: f.tag};
    }).filter(x=>x.valor>0).sort((a,b)=>b.receita-a.receita);
}
// Cruzamento HISTÓRICO: quais contas casariam com este produto pelos gatilhos,
// ignorando a janela de captação (usado para produtos encerrados / mês passado).
function clientesCruzados(pid){
  const prod = PRODUTOS.find(x=>x.id===pid); if(!prod) return [];
  const gats = prod.gatilhos||[];
  const out=[];
  contas.forEach(c=>{
    const f = (c.flags||[]).find(x=>gats.includes(x.tag));
    if(!f) return;
    const valor = f.valor && f.valor>0 ? f.valor : c.patrimonio*SLOT.alvo;
    if(!(valor>0)) return;
    out.push({c, valor, pctSlot: c.patrimonio? valor/c.patrimonio*100:0,
              receita: valor*roaDe(prod)/100, motivo: f.tag});
  });
  return out.sort((a,b)=>b.receita-a.receita);
}

function roaDe(prod){
  if(!prod) return 1.5;
  if(prod.roa!=null && !isNaN(prod.roa)) return prod.roa;
  const m = (typeof METAS!=="undefined") ? METAS.find(x=>x.classe===prod.classeMeta) : null;
  return m? m.roa : 1.5;
}

}

// ---------- CAPTAÇÃO LÍQUIDA (dinheiro novo, não realocação) ----------
const RE_ENTRADA = /RECEBIMENTO DE TED|Transfer[êe]ncia recebida da conta digital/i;
const RE_SAIDA   = /RETIRADA EM C\/C|Transfer[êe]ncia enviada para a conta digital/i;
const RE_INTERNO = /TED APLICA[ÇC][ÃA]O FUNDOS/i;   // realocação interna, não é captação
function captacaoDe(c){
  let ent=0, sai=0;
  (c.movimentacoes||[]).forEach(m=>{
    const h=m.historico||"", v=m.valor||0;
    if(RE_INTERNO.test(h)) return;
    if(RE_ENTRADA.test(h)) ent+=Math.abs(v);
    else if(RE_SAIDA.test(h)) sai+=Math.abs(v);
  });
  return {entrada:ent, saida:sai, liquida:ent-sai};
}

// ---------- DERIVATIVOS E ESTRUTURAS MONTADAS ----------
// Pernas de opção/swap vêm com saldo R$ 0,00 e o notional na quantidade.
// Sem isso elas ficam invisíveis em qualquer cálculo por saldo.
const RE_DERIV = /\((CALL|PUT|SWAP|TERMO|FUTURO|NDF)\)\s*$/i;
const DERIV_CLASS = "Derivativos / Estruturas";
function ehDeriv(ativo){ return RE_DERIV.test((ativo||"").trim()); }
function tipoDeriv(ativo){ const m=(ativo||"").trim().match(RE_DERIV); return m? m[1].toUpperCase() : null; }
function subjacenteDeriv(ativo){ return (ativo||"").trim().replace(RE_DERIV,"").trim(); }

// agrupa as pernas por subjacente e identifica o desenho da operação
function estruturasDe(c){
  const legs = (c.posicoes||[]).filter(p=>ehDeriv(p.ativo));
  if(!legs.length) return [];
  const porSub = {};
  legs.forEach(p=>{
    const sub = subjacenteDeriv(p.ativo);
    (porSub[sub] ||= []).push({tipo:tipoDeriv(p.ativo), qtd:p.qtd||0});
  });
  return Object.entries(porSub).map(([sub,ps])=>{
    const callC = ps.filter(x=>x.tipo==="CALL"&&x.qtd>0).reduce((s,x)=>s+x.qtd,0);
    const callV = ps.filter(x=>x.tipo==="CALL"&&x.qtd<0).reduce((s,x)=>s+Math.abs(x.qtd),0);
    const putC  = ps.filter(x=>x.tipo==="PUT" &&x.qtd>0).reduce((s,x)=>s+x.qtd,0);
    const putV  = ps.filter(x=>x.tipo==="PUT" &&x.qtd<0).reduce((s,x)=>s+Math.abs(x.qtd),0);
    const swap  = ps.filter(x=>x.tipo==="SWAP").reduce((s,x)=>s+Math.abs(x.qtd),0);
    let desenho="Pernas avulsas", nota="";
    if(swap && !callC && !callV && !putC){
      desenho="Swap de pré"; nota=`Notional ${swap.toLocaleString("pt-BR")} — perna de taxa, normalmente financiando ou travando o resultado de uma estrutura.`;
    } else if(callC && callV && putC){
      desenho="Fence (capital protegido)"; nota="Call comprada + call vendida + put comprada: piso de proteção com teto de ganho. Desenho típico de capital protegido em ação.";
    } else if(callV && putC && !callC){
      desenho="Collar"; nota="Put comprada financiada pela venda de call: protege a queda abrindo mão da alta acima do teto.";
    } else if(callC && callV && !putC){
      desenho="Call spread"; nota="Trava de alta: participa da valorização dentro de uma faixa.";
    } else if(callV && !callC && !putC){
      desenho="Lançamento coberto"; nota="Venda de call sobre posição existente para gerar renda.";
    } else if(putC && !callC && !callV){
      desenho="Put protetiva"; nota="Proteção pura contra queda.";
    }
    // posição no ativo à vista, se houver
    const spot = (c.posicoes||[]).find(p=>!ehDeriv(p.ativo) && p.ativo.trim().toUpperCase().startsWith(sub.toUpperCase()) && p.saldo);
    const notional = Math.max(callC,callV,putC,putV,swap);
    return {sub, desenho, nota, notional, swap, legs:ps.length, spot: spot? spot.saldo : 0};
  }).sort((a,b)=>b.notional-a.notional);
}
function temEstruturaEm(c, ticker){
  return estruturasDe(c).some(e=>
    e.sub.toUpperCase()===String(ticker||"").trim().toUpperCase().replace(/\s.*$/,"") &&
    /Fence|Collar|Put protetiva/.test(e.desenho));
}

// ---------- DETECÇÃO DE ESTRUTURADAS / COE ----------
// A XP não usa "COE" no nome e espalha entre Alternativo e RV Global.
const RE_COE = /bidirecional|autocall|booster|capital protegid|taxa fixa ou retorno|taxa fixa \d|ponto a ponto|barreira|knock|dupla chance|alta ilimitada|\bcoe\b|bolsa americana|a\.p\. ou retorno|retorno otimizado|multiplicador/i;
// Bond repack: "XP <empresa> <ano> RF ..." — bonds americanos reembalados como RF no Brasil.
// A XP enquadra em Inflação/Pré/Pós, mas são COE (risco de emissor Banco XP + estrutura).
const RE_REPACK = /^XP\s+.+?\s+20\d{2}\s+RF\b/i;
const COE_CLASS = "Estruturados (COE)";
function ehRepack(ativo){ return RE_REPACK.test((ativo||"").trim()); }
function ehCOE(ativo){ return RE_COE.test(ativo||"") || ehRepack(ativo); }
function subtipoCOE(ativo){
  const a=(ativo||"").toLowerCase();
  if(/ouro|gold/.test(a)) return "Ouro";
  if(/bolsa americana|s&p|americana/.test(a)) return "Bolsa Americana";
  if(ehRepack(ativo)) return "Bond Repack";
  return "Outro";
}
// emissor subjacente do repack: XP <EMPRESA> <ano> RF
function emissorRepack(ativo){
  const m=(ativo||"").trim().match(/^XP\s+(.+?)\s+20\d{2}\s+RF\b/i);
  return m ? m[1].trim() : null;
}
// risco de crédito do subjacente: soberano (Tesouro BR emitido lá fora) x corporativo
function riscoRepack(ativo){
  const e=(emissorRepack(ativo)||"").toLowerCase();
  return /brasil soberano|soberano|tesouro|republic|brazil/.test(e) ? "Soberano" : "Corporativo";
}
// indexador do repack — só o de IPCA entrega proteção inflacionária
function indexadorRepack(ativo){
  const a=(ativo||"").toLowerCase();
  if(/\bipca\b|ipc-a/.test(a)) return "IPCA";
  if(/\bpre\b|pré/.test(a)) return "Pré";
  if(/\bcdi\b/.test(a)) return "CDI";
  return "—";
}

function relacionamento(conta){
  const n=notasDe(conta);
  if(!n.length) return {dias:null, status:"Sem registro", cor:"mut", ultimo:null, freq:null};
  const hoje=new Date(), ult=new Date(n[0].data);
  const dias=Math.floor((hoje-ult)/86400000);
  let freq=null;
  if(n.length>=2){
    const prim=new Date(n[n.length-1].data);
    freq=Math.round((ult-prim)/86400000/(n.length-1));
  }
  const status = dias<=30?"Em dia" : dias<=90?"Atenção" : "Frio";
  const cor = dias<=30?"green" : dias<=90?"gold" : "red";
  return {dias, status, cor, ultimo:n[0], freq, total:n.length};
}

// ---------- CLASSIFICAÇÃO POR FUNÇÃO NA CARTEIRA ----------
// Corrige a leitura crua da XP: "Pós Fixado" mistura caixa, crédito com prazo e ilíquido.
function funcaoDe(ativo, estrategia){
  if(OVR.ativos[ativo]) return OVR.ativos[ativo];   // decisão manual do assessor prevalece
  if(ehDeriv(ativo)) return "outro";                // perna de derivativo não entra em liquidez
  if(ehCOE(ativo)) return "iliquido";               // COE não é caixa nem crédito líquido
  const a=(ativo||"").toLowerCase(), e=(estrategia||"").toLowerCase();
  if(/fiagro|\bfii\b|\bfip\b|feeder|imobili|malls|infra[- ]?yield|infra v|\d{2}11\b/.test(a)) return "iliquido";
  if(/\bcdb\b|\blca\b|\blci\b|\blf\b|debent|cr[ée]dit|banc[áa]rio|corporate|advanced|total credit/.test(a)) return "credito";
  if(/tesouro selic|\blft\b|referenciada|lotus fif rf|trend di|caixa|conta corrente|selic/.test(a)) return "liquido";
  if(/pós fixado|caixa/.test(e)) return "credito";
  return "outro";
}
// perfil de liquidez de uma conta
function liqDe(c){
  const t = c.patrimonio||0;
  let liquido=0, credito=0, iliquido=0, balde=0;
  (c.posicoes||[]).forEach(p=>{
    const v=p.saldo||0, f=funcaoDe(p.ativo,p.estrategia), e=(p.estrategia||"");
    if(f==="liquido") liquido+=v; else if(f==="credito") credito+=v; else if(f==="iliquido") iliquido+=v;
    if(/Pós Fixado|Caixa/.test(e)) balde+=v;
  });
  const o = OVR.contas[c.conta]||{};
  const reserva = parseFloat(o.reserva)||0;
  return {liquido, credito, iliquido, balde, t, reserva,
          intencional: !!o.intencional, nota: o.nota||"",
          folga: reserva? Math.max(liquido-reserva,0) : null,
          pct: t? liquido/t*100 : 0,
          pctBalde: t? balde/t*100 : 0,
          falsa: balde>t*0.25 && liquido < balde*0.6};
}

function alocDe(c, nomes){
  let t = c.estrategias.reduce((s,e)=>s+Math.max(e.saldo||0,0),0);
  if(!t) return null;
  let v = c.estrategias.filter(e=>nomes.some(n=>e.nome.toLowerCase().includes(n))).reduce((s,e)=>s+Math.max(e.saldo||0,0),0);
  return {pct: v/t*100, val: v};
}

// ---------- motor de oportunidades c/ produto sugerido ----------
function flagsDe(c){
  const f = [];
  const p = c.patrimonio||0;
  const L = liqDe(c);
  if(L.intencional){
    f.push({tag:"Caixa intencional",cor:"mut",prods:[],
      txt:`Caixa de ${fmtK(L.liquido)} marcado como intencional${L.nota?` — ${L.nota}`:""}. Sem alerta de alocação; acompanhar o gatilho combinado.`,valor:null});
  }
  else if(L.reserva>0){

function _hojeISO(){ return new Date().toISOString().slice(0,10); }

// Converte "31/08/2026" -> "2026-08". Lê direto de contas (mesma fonte do header),
// para não depender da ordem de init da const DATA_REF.
function mesDeRef(ref){
  if(!ref) return null;
  const m=String(ref).match(/(\d{2})\/(\d{2})\/(\d{4})/);
  return m? `${m[3]}-${m[2]}` : null;
}
function mesRefAtual(){
  // ref mais frequente entre as contas (igual ao DATA_REF do header)
  const cnt={}; (typeof contas!=="undefined"?contas:[]).forEach(c=>{ if(c.ref) cnt[c.ref]=(cnt[c.ref]||0)+1; });
  const arr=Object.entries(cnt).sort((a,b)=>b[1]-a[1]);
  return arr.length? mesDeRef(arr[0][0]) : mesDeRef(_hojeISO().split("-").reverse().join("/").replace(/^(\d{2})\/(\d{2})/,"$1/$2"));
}
// mês em que o produto foi cadastrado/reativado (carimbo). Fallback: deriva da janela.
function mesDoProduto(p){
  if(p.mesRef) return p.mesRef;
  if(p.capFim){ const m=p.capFim.match(/^(\d{4})-(\d{2})/); if(m) return `${m[1]}-${m[2]}`; }
  if(p.capIni){ const m=p.capIni.match(/^(\d{4})-(\d{2})/); if(m) return `${m[1]}-${m[2]}`; }
  return null;
}
// Produto é "do mês passado" quando o mês em que entrou é anterior ao mês da data do topo.
function produtoDoMesPassado(p){
  // Controle MANUAL: o produto vai para "mês passado" quando você o arquiva.
  return !!p.arquivado;
}
function statusProduto(p){
  const hoje=_hojeISO();
  if(!p.capFim && !p.capIni) return {nivel:"sempre", label:"Sem janela", cor:"mut", dias:null};
  if(p.capIni && hoje < p.capIni){
    const d=Math.ceil((new Date(p.capIni)-new Date(hoje))/864e5);
    return {nivel:"futuro", label:`Abre em ${d}d`, cor:"sky", dias:d};
  }
  if(p.capFim && hoje > p.capFim) return {nivel:"encerrado", label:"Encerrado", cor:"red", dias:null};
  // dentro da janela
  if(p.capFim){
    const d=Math.ceil((new Date(p.capFim)-new Date(hoje))/864e5);
    if(d<=3) return {nivel:"fechando", label:`Encerra em ${d}d`, cor:"gold", dias:d};
    return {nivel:"aberto", label:`Em captação · ${d}d`, cor:"green", dias:d};
  }
  return {nivel:"aberto", label:"Em captação", cor:"green", dias:null};
}
function produtoAtivo(p){
  if(p.arquivado) return false; // arquivado manualmente -> fora do radar/mensagens/oportunidades
  return statusProduto(p).nivel !== "encerrado" && statusProduto(p).nivel !== "futuro";
}

const ATIVOS = (()=>{
  const m = {};
  contas.forEach(c=>c.posicoes.forEach(p=>{
    if(!p.saldo) return;
    const k = p.ativo;
    if(!m[k]) m[k] = {ativo:k, estrategia:p.estrategia, vol:0, clientes:[]};

const RE_ETF = /^(BOVA|IVVB|SMAL|GOLD|HASH|ETHE|COIN|QBTC|DOLA|LFTS|CDII|IMOV|BBSD|SPXI|XINA|EURP|NASD|ACWI|DIVO|FIND|MATB|ISUS|GOVE|PIBB)\d*/i;
function acaoSugerida(a){
  const e = (a.estrategia||"").toLowerCase();

  if(ehCOE(a.ativo)) return {t:"Cronograma de vencimento", d:"Estruturada com liquidez restrita: mapear vencimento e planejar o destino do recurso com antecedência. Risco de emissor Banco XP a considerar na diversificação."};

  if(RE_ETF.test(cod)) return {t:"Ajuste de exposição via ETF", d:`ETF de índice/commodity em ${a.n} cliente(s) — instrumento de alocação, não de troca por oferta. Avaliar se o tamanho da posição reflete a visão de mercado do cliente.`};
  if(/tesouro selic|\blft\b/i.test(nome)) return {t:"Caixa — dimensionar reserva", d:"É o colchão de liquidez. Avaliar apenas se o tamanho excede a reserva necessária do cliente."};
  if(e.includes("renda variável") && !RE_ETF.test(cod)) return {t:"Operação estruturada sobre o papel", d:`${a.n} clientes posicionados — volume que comporta estruturada de proteção/fence, ou monetização via lançamento coberto.`};
  if(e.includes("listados")) return {t:"Troca por oferta primária", d:"Comparar yield, vacância e desconto sobre VP com as ofertas de FII do mês. Giro com upgrade de qualidade."};
  if(e.includes("pós")) return {t:"Destravar liquidez", d:"Recurso em pós-fixado: candidato a migração parcial da parcela acima da reserva."};
  if(e.includes("inflação")) return {t:"Alongamento / marcação", d:"Avaliar ganho de marcação, escalonar vértices e comparar spread com IPCA+ isento privado."};

  return {t:"Revisão", d:"Avaliar função da posição e adequação do tamanho ao slot de risco."};
}

  if(!tot) return "";
  let acc=0, stops=[];
  items.forEach(([n,v])=>{const a=v/tot*360; stops.push(`${col(n)} ${acc}deg ${acc+a}deg`); acc+=a;});
  return `<div style="width:${size}px;height:${size}px;border-radius:50%;background:conic-gradient(${stops.join(",")});position:relative;flex-shrink:0">
    <div style="position:absolute;inset:${Math.round(size*0.16)}px;background:var(--panel);border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center">
      <div style="font-size:10px;color:var(--dim)">${totLabel||"Total"}</div>
      <div style="font-weight:700;font-size:${size>140?14:12}px">${fmtK(tot)}</div>
    </div></div>`;
}

// ---------- CONSOLIDADO ----------
function estrAgg(){
  const m = {};
  contas.forEach(c=>c.estrategias.forEach(e=>{
    if(e.saldo==null||e.saldo<=0) return;
    m[e.nome] = (m[e.nome]||0) + e.saldo;
  }));
  return Object.entries(m).sort((a,b)=>b[1]-a[1]);
}

// ---------- RADAR ----------
let filtroTag = null;
function vOps(){
  const all = [];
  contas.forEach(c=>c.flags.forEach(f=>all.push({c,f})));
  const tags = [...new Set(all.map(x=>x.f.tag))];
  const list = filtroTag ? all.filter(x=>x.f.tag===filtroTag) : all.filter(x=>!x.f.gld);
  list.sort((a,b)=>(b.f.valor||0)-(a.f.valor||0) || b.c.patrimonio-a.c.patrimonio);
  return `
  <div class="chips">
    <div class="chip ${!filtroTag?"on":""}" onclick="filtroTag=null;render('ops')">Principais (${all.filter(x=>!x.f.gld).length})</div>
    ${tags.map(t=>`<div class="chip ${filtroTag===t?"on":""}" onclick="filtroTag='${t}';render('ops')">${t} (${all.filter(x=>x.f.tag===t).length})</div>`).join("")}
  </div>
  ${list.length?list.map(({c,f})=>`
    <div class="opcard" onclick="abrirCliente('${c.conta}')">
      <div class="t">Conta ${c.conta}${cpBtn(c.conta)} <span class="pill ${f.cor}">${f.tag}</span> <span class="pill mut">${c.segmento||""}</span> <span style="color:var(--gold);font-size:12px">${fmtK(c.patrimonio)}</span>
      ${f.prods.map(pid=>{const p=PRODUTOS.find(x=>x.id===pid);return `<span class="pill ${p.cor}">→ ${p.nome.split("—")[0].split(" FII")[0].trim()}</span>`}).join("")}</div>
      <div class="d">${f.txt}</div>
      ${f.valor?`<div class="m">Potencial de alocação: ${fmtK(f.valor)}${f.prods.length?` · receita estimada ~${fmt(f.valor*(PRODUTOS.find(x=>x.id===f.prods[0])?.roa||1.5)/100)}`:""}</div>`:""}
    </div>`).join(""):`<div class="empty">Nenhuma oportunidade nesse filtro.</div>`}
  <div class="hint">Cada sinal já aponta o produto do mês compatível e a receita estimada pelo ROA da classe. O filtro "Proteção GLD 3–5%" lista a campanha da estruturada de ouro para toda a base.</div>`;
}

  return `

    <div class="card kpi"><div class="lbl">Ideia de atuação</div><div class="val" style="font-size:14px;color:var(--gold)">Estruturada em ${[...ATIVOS].filter(a=>(a.estrategia||"").includes("Variável")).sort((a,b)=>b.n-a.n)[0]?.ativo||"—"}</div><div class="det">papel com mais clientes em RV</div></div>
  </div>
  <div class="card mt">
    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
      <div class="sec" style="margin:0">Cotações ao vivo da B3 (brapi.dev)</div>

      <button onclick="buscaCotacoes(ATIVOS.map(a=>tickerDe(a.ativo)));buscaIbov()" style="background:var(--panel2);border:1px solid var(--line);color:var(--sky);border-radius:8px;padding:6px 14px;font-size:12px;cursor:pointer">↻ Atualizar cotações</button>
      <span class="sub" style="margin-left:auto">${cotStatus||(BRAPI_TOKEN?"Token configurado ✓ — 154 tickers liberados. Cotações carregam automaticamente ao abrir esta aba.":"Sem token: apenas PETR4, VALE3, MGLU3 e ITUB4.")}</span>
    </div>
  </div>
  <div class="mt">
    <input class="search" placeholder="Buscar ativo… (ex: VALE3, CDB, Tesouro)" value="${buscaAtv}" oninput="buscaAtv=this.value;render('ativos')" />
    <div class="chips">
      <div class="chip ${!filtroEstr?"on":""}" onclick="filtroEstr=null;render('ativos')">Todas</div>

      <div class="chip ${filtroEstr===COE_CLASS?"on":""}" onclick="filtroEstr='${COE_CLASS}';render('ativos')">${COE_CLASS}</div>

    </div>
  </div>
  ${(()=>{
    // agrega por classe: volume, nº de clientes distintos, nº de ativos
    const porClasse={};
    contas.forEach(c=>{
      const vistos={};
      c.posicoes.forEach(p=>{
        const e=p.estrategia||"—"; if(!p.saldo) return;
        const k=porClasse[e]=porClasse[e]||{vol:0,ativos:new Set(),clientes:new Set()};
        k.vol+=p.saldo; k.ativos.add(p.ativo); k.clientes.add(c.conta);
      });
    });
    const lista=Object.entries(porClasse).map(([n,v])=>({n,vol:v.vol,nAtivos:v.ativos.size,nCli:v.clientes.size}))
      .sort((a,b)=>b.vol-a.vol);
    // agregado transversal de estruturadas (COE)
    const coeAgg={vol:0,cli:new Set(),ativos:new Set(),porTipo:{}};
    contas.forEach(c=>c.posicoes.forEach(p=>{
      if(!p.saldo||!ehCOE(p.ativo)) return;
      coeAgg.vol+=p.saldo; coeAgg.cli.add(c.conta); coeAgg.ativos.add(p.ativo);
      const st=subtipoCOE(p.ativo);
      coeAgg.porTipo[st]=coeAgg.porTipo[st]||{vol:0,cli:new Set()};
      coeAgg.porTipo[st].vol+=p.saldo; coeAgg.porTipo[st].cli.add(c.conta);
    }));
    if(coeAgg.vol) lista.push({n:COE_CLASS, vol:coeAgg.vol, nAtivos:coeAgg.ativos.size, nCli:coeAgg.cli.size, coe:true});
    // derivativos: medidos por notional, não por saldo (saldo é sempre 0)
    const derAgg={notional:0, cli:new Set(), legs:0, estruturas:[]};
    contas.forEach(c=>{
      const es=estruturasDe(c);
      if(!es.length) return;
      derAgg.cli.add(c.conta);
      es.forEach(e=>{ derAgg.notional+=e.notional; derAgg.legs+=e.legs; derAgg.estruturas.push({...e, conta:c.conta}); });
    });
    if(derAgg.cli.size) lista.push({n:DERIV_CLASS, vol:0, notional:derAgg.notional,
      nAtivos:derAgg.legs, nCli:derAgg.cli.size, deriv:true});
    lista.sort((a,b)=>b.vol-a.vol);
    if(!filtroEstr){
      // VISÃO GERAL: card por classe
      return `<div class="card" style="margin-bottom:14px">
        <div class="sec">Panorama por classe de ativo — clique para abrir</div>
        <div class="grid g3">
          ${lista.map(x=>`<div class="card" style="background:var(--panel2);cursor:pointer" onclick="filtroEstr='${x.n}';render('ativos')">
            <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
              <span class="dot" style="background:${col(x.n)};width:11px;height:11px"></span>
              <span style="font-weight:600;font-size:13px">${x.n}</span>

            <div style="font-size:19px;font-weight:700;color:${col(x.n)}">${x.deriv?x.notional.toLocaleString("pt-BR"):fmtK(x.vol)}</div>
