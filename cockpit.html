      '<div class="cmprow"><span class="lb">Proposta</span><div class="cbar"><i style="width:'+(ps/maxC*100)+'%;background:'+col+'"></i><span>'+ps.toFixed(0)+'% · R$ '+fmt0(T*ps/100)+'</span></div></div></div>';
  });
  // movimentações por classe
  html+='<div class="card" style="margin-bottom:16px"><h3>Movimentações sugeridas por classe</h3><table class="mov"><tr><th>Classe</th><th>Atual</th><th>Proposta</th><th>Δ R$</th><th>Ação</th></tr>';
  ids.forEach(id=>{const ca=P('atual').find(c=>c.id===id),cs=P('sim').find(c=>c.id===id);const pa=ca?classSum(ca):0,ps=cs?classSum(cs):0;
    const d=T*(ps-pa)/100;const act=Math.abs(d)<1?['keep','Manter']:(d>0?['buy','Aportar']:['sell','Resgatar']);const nm=(cs||ca).name;
    html+='<tr><td>'+esc(nm)+'</td><td>'+pa.toFixed(0)+'% · '+fmt0(T*pa/100)+'</td><td>'+ps.toFixed(0)+'% · '+fmt0(T*ps/100)+'</td><td style="color:'+(d>0?'#5fd18c':d<0?'#eb8f8c':'var(--ink-dim)')+'">'+(d>=0?'+':'−')+'R$ '+fmt0(Math.abs(d))+'</td><td><span class="tag '+act[0]+'">'+act[1]+'</span></td></tr>';});
  html+='</table></div>';
  // entra / sai (ativos)
  const buys=[];P('sim').forEach(c=>c.slots.forEach(s=>{if(!s.open&&s.pct>0)buys.push({n:s.name,v:T*s.pct/100,col:c.color});}));
  const sells=[];P('atual').forEach(c=>c.slots.forEach(s=>{if(s.pct>0)sells.push({n:s.name,v:T*s.pct/100,col:c.color});}));
  html+='<div class="twocol"><div class="lst"><h4>Entra na carteira (proposta)</h4>'+(buys.length?buys.map(b=>'<div class="li"><span class="n">'+esc(b.n)+'</span><span class="v">R$ '+fmt0(b.v)+'</span></div>').join(''):'<div class="li"><span class="n" style="color:var(--ink-dim)">Preencha os ativos da proposta</span></div>')+'</div>'+
    '<div class="lst"><h4>Sai / é substituído (atual)</h4>'+(sells.length?sells.map(b=>'<div class="li"><span class="n">'+esc(b.n)+'</span><span class="v">R$ '+fmt0(b.v)+'</span></div>').join(''):'<div class="li"><span class="n" style="color:var(--ink-dim)">Sem carteira atual</span></div>')+'</div></div>';
  box.innerHTML=html;
}

/* ---------- Projeção ---------- */
function project(cap,anos,ret,inf,flow){const rm=Math.pow(1+ret/100,1/12)-1;const infA=inf/100;
  const nom=[cap],inv=[cap],aporteAnual=[0];let V=cap,I=cap;
  for(let ano=1;ano<=anos;ano++){
    // aporte cheio no ano 1; corrigido pela inflação a partir do ano 2
    const flowAno=flow*Math.pow(1+infA,ano-1);
    aporteAnual.push(flowAno*12);
    for(let mes=1;mes<=12;mes++){V=V*(1+rm)+flowAno;I=I+flowAno;}
    nom.push(V);inv.push(I);
  }
  const real=nom.map((v,t)=>v/Math.pow(1+infA,t));return{nom,real,inv,aporteAnual};}
function renderProj(){
  const cap=parseBRL(document.getElementById('pCap').value)||state.total;
  const flow=parseBRL(document.getElementById('pFlow').value)||0;
  const anos=Math.max(1,parseInt(document.getElementById('pAnos').value)||10);
  const ret=parseFloat(document.getElementById('pRet').value)||0;
  const inf=parseFloat(document.getElementById('pInf').value)||0;
  const real=((1+ret/100)/(1+inf/100)-1)*100;document.getElementById('pReal').value=real.toFixed(2).replace('.',',')+'%';
  const {nom,real:rl,inv,aporteAnual}=project(cap,anos,ret,inf,flow);const vN=nom[anos],vR=rl[anos],iv=inv[anos];
  document.getElementById('projTitle').textContent='Evolução — '+anos+' anos'+(flow?(flow<0?' · retirada R$ '+fmt0(-flow)+'/mês':' · aporte R$ '+fmt0(flow)+'/mês'):'');
  document.getElementById('kpiProj').innerHTML='<div class="kpi"><div class="k">Valor final nominal</div><div class="v" style="color:'+(vN<0?'var(--bad)':'var(--gold-soft)')+'">R$ '+fmt0(vN)+'</div><div class="d">'+(vN/cap).toFixed(2).replace('.',',')+'×</div></div>'+
    '<div class="kpi"><div class="k">Valor final real</div><div class="v" style="color:var(--pre)">R$ '+fmt0(vR)+'</div><div class="d">poder de compra</div></div>'+
    '<div class="kpi"><div class="k">Total investido</div><div class="v">R$ '+fmt0(iv)+'</div><div class="d">capital + fluxos</div></div>'+
    '<div class="kpi"><div class="k">Capitalização</div><div class="v" style="color:var(--cdi)">R$ '+fmt0(vN-iv)+'</div><div class="d">acima do investido</div></div>';
  const W=680,H=320,pl=64,pr=18,pt=22,pb=30,iw=W-pl-pr,ih=H-pt-pb;
  const all=[...nom,...rl,...inv];let maxV=Math.max(...all),minV=Math.min(0,...all);maxV*=1.12;if(minV<0)minV*=1.12;
  const x=t=>pl+iw*t/anos,y=v=>pt+ih*(1-(v-minV)/(maxV-minV));
  const line=arr=>arr.map((v,i)=>(i?'L':'M')+x(i).toFixed(1)+','+y(v).toFixed(1)).join(' ');
  const zB=minV<0?0:minV;const areaNom='M'+x(0)+','+y(zB).toFixed(1)+' '+nom.map((v,i)=>'L'+x(i).toFixed(1)+','+y(v).toFixed(1)).join(' ')+' L'+x(anos)+','+y(zB).toFixed(1)+' Z';
  let grid='';for(let g=0;g<=4;g++){const gv=minV+(maxV-minV)*g/4,gy=y(gv);grid+='<line x1="'+pl+'" y1="'+gy+'" x2="'+(W-pr)+'" y2="'+gy+'" stroke="#24405f" stroke-width="1" opacity=".5"/><text x="'+(pl-8)+'" y="'+(gy+4)+'" text-anchor="end" fill="#9DB0C6" font-size="10">'+ab(gv)+'</text>';}
  if(minV<0){const zy=y(0);grid+='<line x1="'+pl+'" y1="'+zy+'" x2="'+(W-pr)+'" y2="'+zy+'" stroke="#9DB0C6" stroke-width="1"/>';}
  const stepL=anos<=10?1:anos<=20?2:Math.ceil(anos/10);let xlab='',mk='';
  for(let t=0;t<=anos;t++){xlab+='<text x="'+x(t)+'" y="'+(H-8)+'" text-anchor="middle" fill="#9DB0C6" font-size="10">'+t+'</text>';
    if(t%stepL===0){const an=t===0?'start':t===anos?'end':'middle',yy=y(nom[t]),up=nom[t]>=0;mk+='<circle cx="'+x(t)+'" cy="'+yy+'" r="3.2" fill="#C9A227" stroke="#0B1A2E" stroke-width="1"/><text x="'+x(t)+'" y="'+(yy+(up?-9:16))+'" text-anchor="'+an+'" fill="#E0C158" font-size="10" font-weight="700">'+ab(nom[t])+'</text>';}}
  document.getElementById('projChart').innerHTML='<svg viewBox="0 0 '+W+' '+H+'" width="100%"><defs><linearGradient id="ga" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C9A227" stop-opacity="0.32"/><stop offset="1" stop-color="#C9A227" stop-opacity="0.03"/></linearGradient></defs>'+grid+xlab+'<path d="'+areaNom+'" fill="url(#ga)"/><path d="'+line(inv)+'" fill="none" stroke="#9DB0C6" stroke-width="1.4" stroke-dasharray="2 3" opacity=".8"/><path d="'+line(rl)+'" fill="none" stroke="#3B82D6" stroke-width="2" stroke-dasharray="5 4"/><path d="'+line(nom)+'" fill="none" stroke="#C9A227" stroke-width="2.5"/>'+mk+'</svg>';
  // ----- tabela ano a ano: aporte anual (corrigido pela inflação), investido acumulado, patrimônio e crescimento -----
  document.getElementById('projTable').innerHTML = projTableHTML(nom,inv,aporteAnual,anos,flow,inf);
}

// gera o HTML da tabela ano a ano (reutilizado na tela e no relatório A4)
// paraRelatorio=true usa cores do tema claro (fundo branco)
function projTableHTML(nom,inv,aporteAnual,anos,flow,inf,paraRelatorio){
  const corrige = flow!==0 && inf>0;
  // paleta conforme o tema
  const cPos = paraRelatorio ? '#2E7D4F' : '#5fd18c';     // crescimento positivo
  const cNeg = paraRelatorio ? '#B23B36' : '#eb8f8c';     // negativo
  const cRend = paraRelatorio ? '#2E7D4F' : 'var(--cdi)'; // rendimento
  const cDim = paraRelatorio ? '#6A7A8C' : 'var(--ink-dim)';
  let rows='';
  for(let t=1;t<=anos;t++){
    const ap=aporteAnual[t];
    const cresc=nom[t]-nom[t-1];
    const rendimento=cresc-ap;
    const crescPct=nom[t-1]!==0?(cresc/nom[t-1]*100):0;
    rows+='<tr>'+
      '<td style="font-weight:700">Ano '+t+'</td>'+
      '<td class="r" style="color:'+(ap<0?cNeg:cDim)+'">'+(ap>=0?'+':'−')+'R$ '+fmt0(Math.abs(ap))+'</td>'+
      '<td class="r">R$ '+fmt0(inv[t])+'</td>'+
      '<td class="r" style="color:'+cRend+'">R$ '+fmt0(rendimento)+'</td>'+
      '<td class="r" style="font-weight:700">R$ '+fmt0(nom[t])+'</td>'+
      '<td class="r" style="color:'+(cresc>=0?cPos:cNeg)+';font-weight:700">'+(cresc>=0?'+':'−')+'R$ '+fmt0(Math.abs(cresc))+'<span style="color:'+cDim+';font-weight:400;font-size:11px"> ('+(crescPct>=0?'+':'')+crescPct.toFixed(1).replace('.',',')+'%)</span></td>'+
      '</tr>';
  }
  const totalAportado=aporteAnual.reduce((a,b)=>a+b,0), crescTotal=nom[anos]-nom[0], rendTotal=crescTotal-totalAportado;
  const nota = corrige
    ? 'O <b>aporte no ano</b> começa no valor informado (R$ '+fmt0(flow)+'/mês) e é <b>corrigido pela inflação de '+fp(inf)+' a partir do 2º ano</b>, para manter o poder de compra do que o cliente guarda. O <b>rendimento no ano</b> é o crescimento fora o aporte; o <b>crescimento no ano</b> soma aporte + rendimento.'
    : 'O <b>aporte no ano</b> é o fluxo mensal informado × 12. O <b>rendimento no ano</b> é o crescimento fora o aporte; o <b>crescimento no ano</b> soma aporte + rendimento — a variação total do patrimônio de um ano para o outro.';
  return '<div style="overflow-x:auto"><table class="projtbl">'+
    '<thead><tr><th>Período</th><th class="r">Aporte no ano</th><th class="r">Investido acum.</th><th class="r">Rendimento no ano</th><th class="r">Patrimônio fim do ano</th><th class="r">Crescimento no ano</th></tr></thead>'+
    '<tbody>'+rows+'</tbody>'+
    '<tfoot><tr>'+
      '<td style="font-weight:800">Total ('+anos+' anos)</td>'+
      '<td class="r" style="font-weight:700">'+(totalAportado>=0?'+':'−')+'R$ '+fmt0(Math.abs(totalAportado))+'</td>'+
      '<td class="r">R$ '+fmt0(inv[anos])+'</td>'+
      '<td class="r" style="color:'+cRend+';font-weight:700">R$ '+fmt0(rendTotal)+'</td>'+
      '<td class="r" style="font-weight:800">R$ '+fmt0(nom[anos])+'</td>'+
      '<td class="r" style="color:'+(crescTotal>=0?cPos:cNeg)+';font-weight:800">'+(crescTotal>=0?'+':'−')+'R$ '+fmt0(Math.abs(crescTotal))+'</td>'+
    '</tr></tfoot>'+
    '</table></div>'+
    '<div style="font-size:11.5px;color:'+cDim+';margin-top:8px">'+nota+'</div>';
}

function render(v){
  curView = v;
  // preservar foco/cursor de um campo de busca (evita perder o cursor a cada tecla)
  const _af = document.activeElement;
  const _focoBusca = (_af && _af.classList && _af.classList.contains("search")) ? {ph:_af.placeholder, start:_af.selectionStart, end:_af.selectionEnd} : null;
  (()=>{ const S=statusAtualizacao(); const el=document.getElementById("selo_atu"); if(!el) return;
    const cor = S.nivel==="atrasado"?"var(--red)":S.nivel==="janela"?"var(--gold)":S.nivel==="proximo"?"var(--sky)":"var(--mut)";
    const txt = S.ultima
      ? `dados de ${S.ultima.split("-").reverse().join("/")} · ${S.diasDesde}d`
      : `sem registro de atualização`;
    el.innerHTML = `<span style="color:${cor}">●</span> <span style="color:var(--mut)">${txt}</span>`;
    el.title = S.pendente ? "Atualização pendente — clique para ver" : `Próxima janela em ${S.faltamProx} dia(s)`;
  })();
  document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("on",t.dataset.v===v));
  const el = document.getElementById("view");
  el.innerHTML = v==="cons"?vConsolidado():v==="ops"?vOps():v==="ativos"?vAtivos():v==="metas"?vMetas():v==="macro"?vMacro():v==="msgs"?vMsgs():v==="sim"?vSim():vClientes();
  if(v==="macro") carregaMacro(false);
  if(v==="ativos" && !window.__cotIniciado){ window.__cotIniciado=true; buscaCotacoes(ATIVOS.slice(0,40).map(a=>tickerDe(a.ativo))); }
  if(v==="sim") SIM.mount();
  // restaura foco e posição do cursor no campo de busca
  if(_focoBusca){
    const inp = [...document.querySelectorAll("input.search")].find(i=>i.placeholder===_focoBusca.ph);
    if(inp){ inp.focus(); try{ inp.setSelectionRange(_focoBusca.start, _focoBusca.end); }catch(e){} }
  }
}

const CHAVES = ["bfr_boletas_jul26","bfr_overrides_v1","bfr_crm_v1","bfr_produtos_v1","bfr_brapi_token"];
function exportarBackup(){
  const dump = {versao:1, gerado:new Date().toISOString(), dados:{}};
  CHAVES.forEach(k=>{ try{ const v=localStorage.getItem(k); if(v) dump.dados[k]=v; }catch(e){} });
  const blob = new Blob([JSON.stringify(dump,null,1)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `backup-cockpit-bfr-${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  const n = Object.keys(dump.dados).length;
  alert(`Backup gerado com ${n} conjunto(s) de dados.\n\nGuarde o arquivo: ele contém boletas, resumos de reunião, demandas, classificações manuais e produtos cadastrados.`);
}
function importarBackup(input){
  const f = input.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = e => {
    try{
      const j = JSON.parse(e.target.result);
      if(!j.dados) throw new Error("formato inválido");
      const chaves = Object.keys(j.dados);
      if(!confirm(`Importar ${chaves.length} conjunto(s) de dados do backup de ${(j.gerado||"").slice(0,10)}?\n\nIsto substitui os dados atuais deste navegador.`)) return;
      chaves.forEach(k=>{ if(CHAVES.includes(k)) localStorage.setItem(k, j.dados[k]); });
      alert("Backup importado. A página será recarregada.");
      location.reload();
    }catch(err){ alert("Não consegui ler o arquivo: "+err.message); }
  };
  r.readAsText(f);
  input.value="";
}

  if(a.n<=2) head+=`\n\n<b>Leitura:</b> posição pontual, presença marginal na base.`;
  else if(a.n>=15) head+=`\n\n<b>Leitura:</b> bastante pulverizado — volume que comporta operação estruturada ou movimento coordenado.`;
  return head+`\n<b>Atuação sugerida:</b> ${ac.t} — ${ac.d}\n\n`+
    a.clientes.slice(0,10).map(cl=>`• <b>${cl.conta}</b> — ${fmt(cl.saldo)} (${fp(cl.aloc)} da carteira)`).join("\n")+
    (a.clientes.length>10?`\n…e mais ${a.clientes.length-10} conta(s)`:"");
}
// tenta identificar um ativo em qualquer frase
function acharAtivo(q){
  const bruto=q.trim();
  // 1) ticker explícito em qualquer posição
  const mt=bruto.toUpperCase().match(/\b([A-Z]{4}(?:3|4|11|5|6|1))\b/);
  if(mt){
    const ex=ATIVOS.filter(a=>lk(a.ativo).startsWith(lk(mt[1])));
    if(ex.length) return ex.sort((x,y)=>y.vol-x.vol)[0];
  }
  // 2) tokens relevantes contra nomes de ativos
  const stop=new Set(["quem","tem","que","voce","você","enxerga","nas","nos","das","dos","com","para","por","como","esta","está","sobre","conta","contas","cliente","clientes","carteira","carteiras","qual","quais","meu","minha","tenho","temos","alguem","alguém","situacao","situação","fala","sobre","posicao","posição","muito","mais","menos","ver","mostra","mostrar","me","do","da","de","em","no","na","o","a","e"]);
  const toks=lk(bruto).replace(/[^a-z0-9\s]/g," ").split(/\s+/).filter(t=>t.length>=3&&!stop.has(t));
  let melhor=null, score=0;
  ATIVOS.forEach(a=>{
    const nome=lk(a.ativo);
    let sc=0;
    toks.forEach(t=>{ if(nome.includes(t)) sc+= (nome.startsWith(t)?3:1) * t.length; });
    if(sc>score){ score=sc; melhor=a; }
  });
  return score>=4 ? melhor : null;
}
function responder(q){
  const s=lk(q);

  // ---- Dividendos: "quais contas recebem dividendos?" ----
  if(/dividendo|provento|rendimento|renda passiva|renda recorrente/.test(s)){
    const lst=[];
    contas.forEach(c=>{ const dv=dividendosDe(c); if(dv.total>0) lst.push({c, dv}); });
    if(!lst.length) return "Não encontrei contas com dividendos ou rendimentos pagos nas movimentações da base atual.";
    lst.sort((a,b)=>b.dv.total-a.dv.total);
    const totalGeral=lst.reduce((s,x)=>s+x.dv.total,0);
    const head=`<b>Contas que recebem dividendos/proventos</b> — ${lst.length} conta(s), total ${fmt(totalGeral)}/mês\n<span style="color:var(--dim)">Fluxo recorrente — gancho para consórcio e renda passiva. Clique numa conta para abrir a ficha.</span>\n`;
    const corpo=lst.slice(0,30).map(x=>{
      const top=x.dv.ativos.slice(0,3).map(a=>`${a.ativo} ${fmt(a.valor)}`).join(" · ");
      return `<b>Conta ${x.c.conta}</b> ${x.c.segmento||""} — <span style="color:var(--gold);font-weight:700">${fmt(x.dv.total)}/mês</span> <span style="color:var(--dim)">(${x.dv.n} ativo${x.dv.n>1?"s":""})</span>\n   ${top}`;
    }).join("\n\n");
    const rod=lst.length>30?`\n\n<span style="color:var(--dim)">…e mais ${lst.length-30} conta(s).</span>`:"";
    return head+"\n"+corpo+rod;
  }

  // ---- Vencimentos: "contas com títulos vencendo em 2026 e 2027" ----
  if(/vencimento|vencendo|vence|vencem|maturidade/.test(s)){
    // anos citados na pergunta (2025..2049); se nenhum, usa todos os que existem
    const anosCitados = [...q.matchAll(/\b(20[2-4]\d)\b/g)].map(m=>m[1]);
    // extrai o ano de vencimento do nome do ativo
    const MES={jan:1,fev:2,mar:3,abr:4,mai:5,jun:6,jul:7,ago:8,set:9,out:10,nov:11,dez:12};
    function anoVenc(nome){
      // formato dd.mm.aaaa
      let m=nome.match(/\b\d{2}[.\/]\d{2}[.\/](20\d{2})\b/); if(m) return m[1];
      // formato MÊS/AAAA  (ABR/2027)
      m=nome.match(/\b(jan|fev|mar|abr|mai|jun|jul|ago|set|out|nov|dez)[\/\-\s]?(20\d{2})\b/i); if(m) return m[2];
      // "Tesouro Selic 2027", "Tesouro IPCA+ 2029", "... 2035"
      const anos=[...nome.matchAll(/\b(20[2-4]\d)\b/g)].map(x=>x[1]);
      if(anos.length) return anos[anos.length-1]; // último ano citado costuma ser o vencimento
      return null;
    }
    const alvo = anosCitados.length? anosCitados : null;
    const achados=[]; // {conta, seg, patr, titulos:[{ativo,ano,saldo}]}
    contas.forEach(c=>{
      const tit=[];
      (c.posicoes||[]).forEach(p=>{
        const a=anoVenc(p.ativo);
        if(a && (!alvo || alvo.includes(a))) tit.push({ativo:p.ativo, ano:a, saldo:p.saldo||0});
      });
      if(tit.length){ tit.sort((x,y)=>x.ano.localeCompare(y.ano)||y.saldo-x.saldo);
        achados.push({c, tit, soma:tit.reduce((s,x)=>s+x.saldo,0)}); }
    });
    if(!achados.length) return `Não encontrei títulos com vencimento${alvo?` em ${alvo.join(" ou ")}`:""} na base. Os vencimentos são lidos do nome do ativo (ex.: "CDB BMG - ABR/2027"), então títulos sem data no nome não entram nessa conta.`;
    achados.sort((a,b)=>b.soma-a.soma);
    const titulo = `<b>Contas com títulos vencendo${alvo?` em ${alvo.join(" e ")}`:""}</b> — ${achados.length} conta(s), total ${fmtK(achados.reduce((s,x)=>s+x.soma,0))}\n`;
    const corpo = achados.slice(0,20).map(x=>{
      const linhas = x.tit.slice(0,8).map(t=>`   • ${t.ativo} — ${fmt(t.saldo)} <span style="color:var(--dim)">[${t.ano}]</span>`).join("\n");
      const extra = x.tit.length>8? `\n   <span style="color:var(--dim)">…+${x.tit.length-8} título(s)</span>`:"";
      return `<b>Conta ${x.c.conta}</b> ${x.c.segmento||""} · ${fmtK(x.soma)} vencendo\n${linhas}${extra}`;
    }).join("\n\n");
    const rodape = achados.length>20? `\n\n<span style="color:var(--dim)">…e mais ${achados.length-20} conta(s).</span>`:"";
    return titulo+"\n"+corpo+rodape;
  }

  // conta específica
  const mConta = q.match(/\b(\d{5,9})\b/);
  if(mConta){
    const c=contas.find(x=>x.conta===mConta[1]);
    if(!c) return `Não encontrei a conta ${mConta[1]} na base.`;
    const L=liqDe(c), pk=pacoteDe(c), R=relacionamento(c.conta);
    return `<b>Conta ${c.conta}</b> ${c.segmento||""}\nPatrimônio: <b>${fmt(c.patrimonio)}</b>\nRent. mês ${fp(c.rent_mes)} · 12M ${fp(c.portfolio?.m12)} (CDI ${fp(c.cdi?.m12)})\nCaixa real: ${fmtK(L.liquido)} (${fp(L.pct)})\nRelacionamento: ${R.status}${R.dias!=null?` há ${R.dias}d`:""}\n\n<b>Sinais:</b> ${c.flags.map(f=>f.tag).join(", ")||"nenhum"}\n<b>Pauta:</b> ${pk.itens.length?pk.itens.map(x=>`${x.p.nome.split("—")[0].trim()} ${fmt(x.valor)} (${fp(x.pctSlot)})`).join("; "):"sem produto compatível"}\nPacote: ${fmt(pk.valor)} = ${fp(pk.pctCarteira)} da carteira · receita ~${fmt(pk.receita)}`;
  }

  // ativo mencionado em qualquer frase (ticker ou nome)
  const ativoDireto = acharAtivo(q);
  if(ativoDireto && !/meta|captacao|relacionament|indicador|maiores|pauta/.test(s)) return relatorioAtivo(ativoDireto, q);
  if(/quem tem|quais clientes tem|possuem|posicionados/.test(s))
    return "Não localizei esse ativo na base. Tente o código exato (ex: <i>VALE3</i>, <i>HGLG11</i>) ou parte do nome do fundo.";

  // sinais do radar
  const SIN=[["falsa liquidez","Falsa liquidez"],["caixa alto","Caixa acima de 30%"],["caixa acima","Caixa acima de 30%"],
    ["abaixo do cdi","Abaixo do CDI 12M"],["sem ipca","Sem proteção IPCA"],["sem protecao ipca","Sem proteção IPCA"],
    ["sem internacional","Sem internacional"],["fgc","Acima do FGC"],["saida de recursos","Saída de recursos"],
    ["resgate","Saída de recursos"],["concentracao em acao","Concentração em ação"],["ouro","Já tem ouro estruturado"],
    ["repack","Bond repacks na carteira"],["coe","Concentração em COE"],["perda","Posições em perda"]];
  for(const [k,tag] of SIN){
    if(s.includes(k)){
      const cs=contas.filter(c=>c.flags.some(f=>f.tag===tag)).sort((a,b)=>b.patrimonio-a.patrimonio);
      if(!cs.length) return `Nenhuma conta com o sinal "${tag}".`;
      return `<b>${tag}</b> — ${cs.length} conta(s)\n\n`+cs.slice(0,12).map(c=>{
        const f=c.flags.find(x=>x.tag===tag);
        return linhaConta(c, f.valor?`potencial ${fmtK(f.valor)}`:"");
      }).join("\n")+(cs.length>12?`\n…e mais ${cs.length-12}`:"");
    }
  }

  // quem cabe [produto]
  if(/\bcabe\b|indicado para|alvo|quem compra|para quem/.test(s) && !/indicador/.test(s)){
    const p=PRODUTOS.find(x=>lk(q).includes(lk(x.nome.split("—")[0].trim().split(" ")[0])));
    if(p){
      const alvo=clientesDoProduto(p.id);
      return `<b>${p.nome}</b>\n${alvo.length} contas-alvo · receita potencial ${fmtK(alvo.reduce((s2,x)=>s2+x.receita,0))}\n\n`+
        alvo.slice(0,12).map(x=>`• <b>${x.c.conta}</b> — ${fmt(x.valor)} (${fp(x.pctSlot)}) · ${x.motivo}`).join("\n")+
        (alvo.length>12?`\n…e mais ${alvo.length-12}`:"");
    }
    return "Produtos cadastrados: "+PRODUTOS.map(p2=>p2.nome.split("—")[0].trim()).join(", ")+".\nPergunte ex: <i>quem cabe RIZARI</i>";
  }

  // meta / receita
  if(/meta|receita|boleta|quanto falta/.test(s)){
    const real=receitaRealizada();
    return `<b>Meta do mês</b>\nMeta: ${fmt(META_RECEITA)}\nRealizado: <b>${fmt(real)}</b> (${fp(real/META_RECEITA*100)})\nFalta: ${fmt(Math.max(META_RECEITA-real,0))}\nBoletas lançadas: ${BOL.itens.length}\n\nPotencial mapeado no radar: ${fmt(contas.reduce((s2,c)=>s2+pacoteDe(c).receita,0))} em ${contas.filter(c=>pacoteDe(c).itens.length).length} contas.`;
  }

  // captação
  if(/captacao|entrada|saida|ted|transfer/.test(s)){
    const t=contas.reduce((a,c)=>{const x=captacaoDe(c); a.e+=x.entrada; a.s+=x.saida; return a;},{e:0,s:0});
    const top=contas.map(c=>({c,x:captacaoDe(c)})).filter(o=>o.x.liquida!==0).sort((a,b)=>b.x.liquida-a.x.liquida);
    return `<b>Captação do mês</b>\nEntradas: ${fmt(t.e)}\nSaídas: ${fmt(t.s)}\nLíquida: <b>${fmt(t.e-t.s)}</b>\n\n<b>Maiores entradas:</b>\n`+
      top.slice(0,4).map(o=>linhaConta(o.c,`+${fmtK(o.x.liquida)}`)).join("\n")+
      `\n\n<b>Maiores saídas:</b>\n`+top.slice(-4).reverse().map(o=>linhaConta(o.c,`${fmtK(o.x.liquida)}`)).join("\n");
  }

  // maiores clientes
  if(/maiores|top|ranking|maior patrimonio/.test(s)){
    return `<b>Maiores carteiras</b>\n\n`+contas.slice(0,10).map((c,i)=>`${i+1}. <b>${c.conta}</b> — ${fmtK(c.patrimonio)} ${c.segmento?`(${c.segmento})`:""}`).join("\n")+
      `\n\nAUM total ${fmtK(AUM)} · ticket médio ${fmtK(AUM/contas.length)}`;
  }

  // relacionamento
  if(/frio|sem contato|relacionament|contato|follow/.test(s)){
    const sem=contas.filter(c=>!notasDe(c.conta).length).sort((a,b)=>b.patrimonio-a.patrimonio);
    const frios=contas.filter(c=>{const R=relacionamento(c.conta); return R.dias!=null&&R.dias>90;});
    const dem=contas.filter(c=>demandasDe(c.conta).some(d=>!d.feito));
    return `<b>Relacionamento</b>\nSem nenhum registro: ${sem.length} contas\nFrias (>90 dias): ${frios.length}\nCom demanda em aberto: ${dem.length}\n\n<b>Maiores sem registro:</b>\n`+
      sem.slice(0,8).map(c=>linhaConta(c)).join("\n");
  }

  // volume por classe
  if(/quanto tenho|volume em|classe|alocacao|aloca/.test(s)){
    const agg={};
    contas.forEach(c=>c.posicoes.forEach(p=>{ if(p.saldo) agg[p.estrategia||"—"]=(agg[p.estrategia||"—"]||0)+p.saldo; }));
    const arr=Object.entries(agg).sort((a,b)=>b[1]-a[1]);
    const alvo=arr.find(([k])=>s.includes(lk(k).split(" ")[0]));
    if(alvo){
      const cs=contas.filter(c=>c.posicoes.some(p=>p.estrategia===alvo[0]&&p.saldo));
      return `<b>${alvo[0]}</b>\n${fmt(alvo[1])} (${fp(alvo[1]/AUM*100)} do AUM) · ${cs.length} clientes`;
    }
    return `<b>Alocação consolidada</b>\n\n`+arr.map(([k,v])=>`• ${k}: ${fmtK(v)} (${fp(v/AUM*100)})`).join("\n");
  }

  // indicadores
  if(/selic|ipca|cdi|juro|indicador|macro|ibov/.test(s)){
    const jr=(((1+MACRO.selic.valor/100)/(1+MACRO.ipca12.valor/100))-1)*100;
    return `<b>Indicadores</b>\nSelic: ${fp(MACRO.selic.valor)} a.a.\nCDI: ${fp(MACRO.cdi.valor)} a.a.\nIPCA 12m: ${fp(MACRO.ipca12.valor)}\nJuro real: <b>${fp(jr)}</b>\nIbovespa: ${(window.__ibov||IBOV_MANUAL).toLocaleString("pt-BR",{maximumFractionDigits:0})} pts\n\nUm IPCA+9% equivale a ~${fp(MACRO.ipca12.valor+9)} nominal isento.`;
  }

  // pauta / esteira
  if(/pauta|esteira|ligar|ligacao|prioridade|hoje/.test(s)){
    const pac=contas.map(c=>({c,pk:pacoteDe(c)})).filter(x=>x.pk.itens.length>=2).sort((a,b)=>b.pk.receita-a.pk.receita);
    return `<b>Prioridades da esteira</b> (2+ produtos)\n\n`+pac.slice(0,8).map(({c,pk})=>
      `• <b>${c.conta}</b> ${fmtK(c.patrimonio)} — ${pk.itens.length} produtos · receita ~${fmt(pk.receita)}`).join("\n")+
      `\n\nTotal: ${pac.length} contas com pauta múltipla.`;
  }

  // última tentativa: algum ativo parecido
  const tent=acharAtivo(q);
  if(tent) return relatorioAtivo(tent, q);
  return `Não entendi. Posso responder sobre:\n• <b>uma conta</b> (digite o código)\n• <b>quem tem</b> [ativo]\n• <b>sinais</b>: falsa liquidez, caixa alto, abaixo do CDI, FGC, saída de recursos, ouro, repack\n• <b>quem cabe</b> [produto]\n• <b>meta</b>, <b>captação</b>, <b>maiores clientes</b>, <b>relacionamento</b>, <b>alocação</b>, <b>indicadores</b>, <b>pauta</b>`;
}

render("cons");
carregaMacro(false);
buscaIbov();
