              <span>${x.deriv?"notional":fp(x.vol/AUM*100)+" do AUM"}</span>
              <span>${x.nCli} clientes · ${x.nAtivos} ${x.deriv?"pernas":"ativos"}</span>
            </div>
            ${x.coe?`<div class="hint" style="margin-top:6px;font-size:10px">Transversal: a XP distribui entre Alternativo e RV Global</div>`:""}
          </div>`).join("")}
        </div>
      </div>`;
    }
    // VISÃO DA CLASSE SELECIONADA
    const x=lista.find(y=>y.n===filtroEstr); if(!x) return "";
    // classe de derivativos tem visão própria: notional e desenho da operação
    if(filtroEstr===DERIV_CLASS){
      const porDesenho={};
      derAgg.estruturas.forEach(e=>{ (porDesenho[e.desenho] ||= {n:0,not:0,cli:new Set()});
        porDesenho[e.desenho].n++; porDesenho[e.desenho].not+=e.notional; porDesenho[e.desenho].cli.add(e.conta); });
      const porSub={};
      derAgg.estruturas.forEach(e=>{ (porSub[e.sub] ||= {n:0,not:0,cli:new Set(),desenhos:new Set()});
        porSub[e.sub].n++; porSub[e.sub].not+=e.notional; porSub[e.sub].cli.add(e.conta); porSub[e.sub].desenhos.add(e.desenho); });
      return `
      <div class="grid g4" style="margin-bottom:14px">
        <div class="card kpi"><div class="lbl">Notional total</div><div class="val" style="color:var(--violet)">${derAgg.notional.toLocaleString("pt-BR")}</div><div class="det">exposição via derivativos</div></div>
        <div class="card kpi"><div class="lbl">Clientes operando</div><div class="val">${derAgg.cli.size}</div><div class="det">de ${contas.length} contas</div></div>
        <div class="card kpi"><div class="lbl">Pernas abertas</div><div class="val">${derAgg.legs}</div><div class="det">${derAgg.estruturas.length} estrutura(s)</div></div>
        <div class="card kpi"><div class="lbl">Desenho mais usado</div><div class="val" style="font-size:15px">${Object.entries(porDesenho).sort((a,b)=>b[1].n-a[1].n)[0]?.[0]||"—"}</div><div class="det">${Object.entries(porDesenho).sort((a,b)=>b[1].n-a[1].n)[0]?.[1].n||0} ocorrência(s)</div></div>
      </div>
      <div class="card" style="margin-bottom:14px">
        <div class="sec">Por desenho de operação</div>
        <div class="grid g3">
          ${Object.entries(porDesenho).sort((a,b)=>b[1].not-a[1].not).map(([d,v])=>`
            <div class="card" style="background:var(--panel2)">
              <div style="font-weight:600;font-size:13px;margin-bottom:6px">${d}</div>
              <div style="font-size:17px;font-weight:700;color:var(--violet)">${v.not.toLocaleString("pt-BR")}</div>
              <div style="font-size:11px;color:var(--mut);margin-top:4px">${v.n} operação(ões) · ${v.cli.size} cliente(s)</div>
            </div>`).join("")}
        </div>
        <div class="hint">Estas posições vêm do relatório com saldo R$ 0,00 — o valor está no <b>notional</b> (coluna de quantidade). Por isso não aparecem em nenhuma métrica baseada em saldo, embora representem exposição real.</div>
      </div>
      <div class="card" style="margin-bottom:14px">
        <div class="sec">Por ativo subjacente</div>
        ${Object.entries(porSub).sort((a,b)=>b[1].not-a[1].not).map(([sub,v])=>`
          <div style="margin-bottom:9px">
            <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px;gap:8px">
              <span><b>${sub}</b> ${[...v.desenhos].map(d=>`<span class="pill violet" style="font-size:9px">${d}</span>`).join(" ")}</span>
              <span style="color:var(--mut);white-space:nowrap">${v.cli.size} cli · notional ${v.not.toLocaleString("pt-BR")}</span>
            </div>
            <div class="bar"><i style="width:${v.not/Math.max(...Object.values(porSub).map(z=>z.not))*100}%;background:var(--violet)"></i></div>
          </div>`).join("")}
      </div>
      <div class="card">
        <div class="sec">Todas as estruturas abertas</div>
        <div style="overflow-x:auto"><table>
          <tr><th>Conta</th><th>Subjacente</th><th>Desenho</th><th class="r">Notional</th><th class="r">Pernas</th><th class="r">Posição à vista</th><th>Leitura</th></tr>
          ${derAgg.estruturas.sort((a,b)=>b.notional-a.notional).map(e=>`<tr class="click" onclick="abrirCliente('${e.conta}')">
            <td style="font-weight:600;white-space:nowrap">${e.conta}${cpBtn(e.conta)}</td>
            <td style="font-weight:500">${e.sub}</td>
            <td><span class="pill violet">${e.desenho}</span></td>
            <td class="r">${e.notional.toLocaleString("pt-BR")}</td>
            <td class="r" style="color:var(--mut)">${e.legs}</td>
            <td class="r">${e.spot?fmt(e.spot):"—"}</td>
            <td style="font-size:11.5px;color:var(--mut)">${e.nota}</td>
          </tr>`).join("")}
        </table></div>
      </div>`;
    }
    const daClasse=(filtroEstr===COE_CLASS ? ATIVOS.filter(a=>ehCOE(a.ativo))
                                           : ATIVOS.filter(a=>a.estrategia===filtroEstr)).sort((a,b)=>b.vol-a.vol);
    const maisPulv=[...daClasse].sort((a,b)=>b.n-a.n)[0];
    return `<div class="grid g4" style="margin-bottom:14px">
      <div class="card kpi"><div class="lbl">${filtroEstr} · volume</div><div class="val" style="color:${col(filtroEstr)}">${fmtK(x.vol)}</div><div class="det">${fp(x.vol/AUM*100)} do AUM total</div></div>
      <div class="card kpi"><div class="lbl">Clientes na classe</div><div class="val">${x.nCli}</div><div class="det">de ${contas.length} contas</div></div>
      <div class="card kpi"><div class="lbl">Ativos distintos</div><div class="val">${x.nAtivos}</div><div class="det">ticket médio ${fmtK(x.vol/x.nCli)}</div></div>
      <div class="card kpi"><div class="lbl">Mais pulverizado</div><div class="val" style="font-size:15px">${maisPulv?maisPulv.ativo.slice(0,20):"—"}</div><div class="det">${maisPulv?maisPulv.n+" clientes · alvo natural de operação":""}</div></div>
    </div>
    ${filtroEstr===COE_CLASS?`<div class="card" style="margin-bottom:14px">
      <div class="sec">Por subjacente</div>
      <div class="grid g3">
        ${Object.entries(coeAgg.porTipo).sort((a,b)=>b[1].vol-a[1].vol).map(([t,v])=>`
          <div class="card" style="background:var(--panel2)">
            <div style="font-weight:600;font-size:13px;margin-bottom:6px">${t}</div>
            <div style="font-size:18px;font-weight:700;color:var(--gold)">${fmtK(v.vol)}</div>
            <div class="bar" style="margin:6px 0"><i style="width:${v.vol/coeAgg.vol*100}%;background:var(--gold)"></i></div>
            <div style="font-size:11px;color:var(--mut)">${v.cli.size} clientes · ${fp(v.vol/coeAgg.vol*100)} do book de COE</div>
          </div>`).join("")}
      </div>
      <div class="hint">A XP nomeia estes produtos pelo subjacente, sem a palavra "COE". As estruturadas de mercado ficam em Alternativo e RV Global; os <b>bond repacks</b> (padrão "XP empresa ano RF") aparecem como Inflação, Pré ou Pós-Fixado.</div>
    </div>
    ${(()=>{
      const em={};
      contas.forEach(c=>c.posicoes.forEach(p=>{
        if(!p.saldo||!ehRepack(p.ativo)) return;
        const e=emissorRepack(p.ativo)||"—";
        em[e]=em[e]||{vol:0,cli:new Set(),prod:new Set(),idx:new Set()};
        em[e].vol+=p.saldo; em[e].cli.add(c.conta); em[e].prod.add(p.ativo); em[e].idx.add(indexadorRepack(p.ativo));
      }));
      const arr=Object.entries(em).sort((a,b)=>b[1].vol-a[1].vol);
      if(!arr.length) return "";
      const tv=arr.reduce((s,[,v])=>s+v.vol,0);
      return `<div class="card" style="margin-bottom:14px">
        <div class="sec">Bond repacks por emissor subjacente</div>
        ${(()=>{const sob=arr.filter(([e])=>riscoRepack("XP "+e+" 2030 RF")==="Soberano").reduce((s,[,v])=>s+v.vol,0);
          return `<div style="display:flex;gap:14px;margin-bottom:12px;flex-wrap:wrap">
            <span class="pill green">Soberano: ${fmt(sob)} (${fp(sob/tv*100)})</span>
            <span class="pill orange">Corporativo: ${fmt(tv-sob)} (${fp((tv-sob)/tv*100)})</span>
          </div>`;})()}
        ${arr.map(([e,v])=>{const risco=riscoRepack("XP "+e+" 2030 RF");
          const idx=[...v.idx].join("/");
          return `<div style="margin-bottom:9px">
          <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px;gap:8px">
            <span><b>${e}</b> <span class="pill ${risco==="Soberano"?"green":"orange"}" style="font-size:9px">${risco}</span> <span class="pill mut" style="font-size:9px">${idx}</span> <span style="color:var(--dim)">· ${v.prod.size} série(s)</span></span>
            <span style="color:var(--mut);white-space:nowrap">${v.cli.size} cli · ${fmt(v.vol)} · ${fp(v.vol/tv*100)}</span>
          </div>
          <div class="bar"><i style="width:${v.vol/arr[0][1].vol*100}%;background:${risco==="Soberano"?"var(--green)":"var(--orange)"}"></i></div>
        </div>`;}).join("")}
        <div class="hint">Repack de <b>soberano</b> é Tesouro brasileiro emitido no mercado americano e reembalado aqui — risco de crédito soberano, e o indexado a IPCA entrega proteção inflacionária de fato. Repack <b>corporativo</b> soma risco da empresa. Em ambos há o Banco XP como estruturador e liquidez restrita até o vencimento.</div>
      </div>`;
    })()}`:""}
    <div class="card" style="margin-bottom:14px">
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px">
        <div class="sec" style="margin:0">Todos os ${daClasse.length} ativos de ${filtroEstr}</div>
        <div class="chips" style="margin:0">
          <div class="chip ${ordAtv==="vol"?"on":""}" onclick="ordAtv='vol';render('ativos')">por volume</div>
          <div class="chip ${ordAtv==="cli"?"on":""}" onclick="ordAtv='cli';render('ativos')">por nº de clientes</div>
        </div>
      </div>
      <div style="max-height:520px;overflow-y:auto;padding-right:6px">
      ${[...daClasse].sort((p,q)=>ordAtv==="cli"?(q.n-p.n||q.vol-p.vol):(q.vol-p.vol)).map((a,i)=>`<div style="margin-bottom:9px">
        <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px;gap:10px">
          <span style="cursor:pointer" onclick="ativoSel='${a.ativo.replace(/'/g,"\\'")}';render('ativos')"><span style="color:var(--dim);font-size:10px">${i+1}.</span> ${a.ativo}${ehCOE(a.ativo)?` <span class="pill gold" style="font-size:9px">COE</span>`:""}</span>
          <span style="color:var(--mut);white-space:nowrap">${a.n} cli · ${fmtK(a.vol)} · ${fp(a.vol/x.vol*100)}</span>
        </div>
        <div class="bar"><i style="width:${ordAtv==="cli"?(a.n/Math.max(...daClasse.map(z=>z.n))*100):(a.vol/daClasse[0].vol*100)}%;background:${col(filtroEstr)}"></i></div>
      </div>`).join("")}
      </div>
    </div>`;
  })()}
  <div class="card">
    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px">
      <div class="sec" style="margin:0">Tabela completa de ativos</div>
      <div class="chips" style="margin:0">
        <div class="chip ${ordAtv==="vol"?"on":""}" onclick="ordAtv='vol';render('ativos')">volume</div>
        <div class="chip ${ordAtv==="cli"?"on":""}" onclick="ordAtv='cli';render('ativos')">nº de clientes</div>
      </div>
    </div>
    <div style="overflow-x:auto;max-height:620px;overflow-y:auto"><table>
      <tr><th></th><th>Ativo</th><th>Estratégia</th><th class="r">Clientes</th><th class="r">Volume total</th><th class="r">% do AUM</th><th class="r">Cotação B3</th><th>Atuação sugerida</th></tr>
      ${[...list].sort((p,q)=>ordAtv==="cli"?(q.n-p.n||q.vol-p.vol):(q.vol-p.vol)).map(a=>{
        const ac = acaoSugerida(a);
        const open = ativoSel===a.ativo;
        return `<tr class="click" onclick="ativoSel=${open?"null":`'${a.ativo.replace(/'/g,"\\'")}'`};render('ativos')">
          <td style="color:var(--dim)">${open?"▾":"▸"}</td>
          <td style="font-weight:600">${a.ativo}${ehCOE(a.ativo)?` <span class="pill ${ehRepack(a.ativo)?"sky":"gold"}" style="font-size:9px">${ehRepack(a.ativo)?"REPACK":"COE"} ${subtipoCOE(a.ativo)==="Bond Repack"?(emissorRepack(a.ativo)||""):subtipoCOE(a.ativo)}</span>`:""}</td>
          <td><span style="display:inline-flex;align-items:center;gap:6px;color:var(--mut);font-size:12px"><span class="dot" style="background:${col(a.estrategia)}"></span>${a.estrategia||"—"}</span></td>
          <td class="r">${a.n}</td>
          <td class="r" style="font-weight:600">${fmt(a.vol)}</td>
          <td class="r" style="color:var(--mut)">${fp(a.vol/AUM*100)}</td>
          <td class="r">${(()=>{const t=tickerDe(a.ativo);const q=t&&COT[t];
            return q?`<span style="font-weight:600">R$ ${q.preco?.toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2})}</span> <span class="${cls(q.vari)}" style="font-size:11px">${q.vari>=0?"+":""}${fp(q.vari)}</span>`:(t?`<span style="color:var(--dim);font-size:11px">—</span>`:"");})()}</td>
          <td><span class="pill gold">${ac.t}</span></td>
        </tr>
        ${open?`<tr><td colspan="8"><div class="expand">
          <div style="color:var(--mut);font-size:12.5px;margin-bottom:10px">${ac.d}</div>
          <table>
            <tr><th>Conta</th><th>Segmento</th><th class="r">Saldo no ativo</th><th class="r">% da carteira</th><th class="r">Rent. ano</th></tr>
            ${a.clientes.map(cl=>`<tr class="click" onclick="event.stopPropagation();abrirCliente('${cl.conta}')">
              <td style="font-weight:600;white-space:nowrap">${cl.conta}${cpBtn(cl.conta)}</td><td style="color:var(--mut)">${cl.segmento||"—"}</td>
              <td class="r">${fmt(cl.saldo)}</td><td class="r" style="color:var(--mut)">${fp(cl.aloc)}</td>
              <td class="r ${cls(cl.rent_ano)}">${fp(cl.rent_ano)}</td></tr>`).join("")}
          </table>
        </div></td></tr>`:""}`;
      }).join("")}
    </table></div>
    <div class="hint">${list.length} ativos listados${filtroEstr?` na classe ${filtroEstr}`:" (base completa)"}.</div>
  </div>`;
}

// ---------- METAS ----------
let subMeta = "geral";
function vMetas(){
  const G = atingimentoGeral();
  const R = G.R;
  const SUBS = [["geral","Painel Geral"],["captacao","Captação"],["receita","Receita"],["iea","IEA"],["seguros","Seguros"],["nps","NPS"],["hist","Histórico"]];
  const nav = `<div class="chips">${SUBS.map(([k,n])=>{
    const l = G.linhas.find(x=>x.id===k);
    const extra = k==="hist" ? (MET.historico.length?` <span style="opacity:.7">${MET.historico.length}</span>`:"")
                             : (l?` <span style="opacity:.7">${fp(l.at)}</span>`:"");
    return `<div class="chip ${subMeta===k?"on":""}" onclick="subMeta='${k}';render('metas')">${n}${extra}</div>`;
  }).join("")}</div>`;

  // ---------------- PAINEL GERAL ----------------
  if(subMeta==="geral"){
    const t = G.total;
    const corTotal = t>=100?"var(--green)":t>=70?"var(--gold)":"var(--red)";
    return nav + `
    <div class="grid g2e">
      <div class="card" style="display:flex;align-items:center;gap:24px;flex-wrap:wrap">
        <div style="position:relative;width:150px;height:150px;flex-shrink:0">
          <div style="width:150px;height:150px;border-radius:50%;background:conic-gradient(${corTotal} 0deg ${Math.min(t,100)*3.6}deg, var(--panel2) ${Math.min(t,100)*3.6}deg 360deg)"></div>
          <div style="position:absolute;inset:16px;background:var(--panel);border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center">
            <div style="font-size:11px;color:var(--dim)">Meta do mês</div>
            <div style="font-size:28px;font-weight:800;color:${corTotal}">${fp(t)}</div>
            <div style="font-size:10px;color:var(--dim)">${G.linhas.filter(l=>l.at>=100).length} de ${G.linhas.length} batidas</div>
          </div>
        </div>
        <div style="flex:1;min-width:220px">
          <div style="font-size:13px;color:var(--mut);margin-bottom:4px">Pontos por meta</div>
          <div style="font-size:11px;color:var(--dim);margin-bottom:12px">Cada meta vale seu peso. Binárias entregam o peso cheio ou zero; proporcionais pagam conforme o atingimento e podem passar do peso.</div>
          ${G.linhas.map(l=>{
            const bateu = l.at>=100;
            const cor = bateu?"var(--green)":(l.binaria?"var(--red)":(l.at>=60?"var(--gold)":"var(--red)"));
            const sub = l.binaria
              ? `${fmtMeta(l.real,l.tipo)} de ${fmtMeta(l.meta,l.tipo)}${bateu?" — meta batida":` — ${fp(l.at===0?l.prog:l.at)} do alvo, ainda sem pontuar`}`
              : `${fmtMeta(l.real,l.tipo)} de ${fmtMeta(l.meta,l.tipo)} — ${fp(l.at)}${l.at>100?" (excedente soma acima do peso)":""}`;
            return `<div style="margin-bottom:11px">
            <div style="display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px;margin-bottom:3px;gap:8px">
              <span style="cursor:pointer" onclick="subMeta='${l.id}';render('metas')">${l.nome}
                ${l.binaria?`<span class="pill ${bateu?"green":"mut"}" style="font-size:9px">binária</span>`:""}</span>
              <span style="white-space:nowrap">
                <b style="color:${cor};font-size:14px">${fp(l.pontos)}</b>
                <span style="color:var(--dim);font-size:11px"> de ${l.peso}%</span>
              </span>
            </div>
            <div class="bar"><i style="width:${l.prog}%;background:${cor}"></i></div>
            <div style="font-size:10.5px;color:var(--dim);margin-top:3px">${sub}</div>
          </div>`;}).join("")}
        </div>
      </div>
      <div class="card">
        <div class="sec">Onde está o retorno de cada esforço</div>
        <div style="overflow-x:auto"><table>
          <tr><th>Meta</th><th class="r">Realizado</th><th class="r">Meta</th><th class="r">Falta</th><th class="r">Impacto</th></tr>
          ${G.linhas.slice().sort((a,b)=>{
            // ordena pelo melhor retorno por esforço: binárias perto de bater primeiro
            const ga = a.at>=100?0:(a.binaria? a.peso*(a.prog/100) : (Math.max(a.meta-(a.real||0),0)/a.meta*100)*(a.peso/100));
            const gb = b.at>=100?0:(b.binaria? b.peso*(b.prog/100) : (Math.max(b.meta-(b.real||0),0)/b.meta*100)*(b.peso/100));
            return gb-ga;
          }).map(l=>{
            const falta = Math.max(l.meta - (l.real||0), 0);
            const ganho = l.at>=100 ? 0 : (l.binaria ? l.peso : (falta/l.meta*100)*(l.peso/100));
            return `<tr class="click" onclick="subMeta='${l.id}';render('metas')">
              <td style="font-weight:600">${l.nome}${l.binaria?` <span class="pill mut" style="font-size:9px">binária</span>`:""}</td>
              <td class="r ${l.at>=100?"pos":""}">${fmtMeta(l.real, l.tipo)}</td>
              <td class="r" style="color:var(--mut)">${fmtMeta(l.meta, l.tipo)}</td>
              <td class="r">${l.at>=100?"—":fmtMeta(falta, l.tipo)}</td>
              <td class="r" style="color:var(--gold);font-weight:${l.binaria&&l.prog>60?"700":"400"}">${l.at>=100?"—":"+"+fp(ganho)}</td>
            </tr>`;
          }).join("")}
          <tr style="border-top:1px solid var(--line)"><td style="font-weight:700">TOTAL</td>
            <td class="r" style="font-weight:800;color:${corTotal}">${fp(t)}</td><td colspan="3"></td></tr>
        </table></div>
        <div class="hint">A coluna <b>Impacto</b> mostra quantos pontos do índice cada meta ainda pode somar. Nas <b>binárias</b> o peso inteiro está em jogo — faltar pouco ou faltar muito dá no mesmo enquanto não bater, então as que estão perto do alvo são sempre a prioridade. A tabela já vem ordenada por esse critério.</div>
      </div>
    </div>

    <div class="card mt">
      <div class="sec">Prioridades da semana — o que o cockpit sugere</div>
      ${(()=>{
        const acoes=[];
        const cap=G.linhas.find(l=>l.id==="captacao");
        if(cap.at<100){
          const falta = cap.meta-cap.real;
          const saindo = contas.filter(c=>captacaoDe(c).liquida<0).length;
          const medio = contas.length? AUM/contas.length : 0;
          acoes.push({t:"Captação",c:"gold",d:`Faltam ${fmt(falta)} (${fp(R.captacao.aportes/Math.max(cap.real,1)*100)} do realizado veio de aporte, o resto de transferência de carteira). Como uma conta média do escritório vale ${fmtK(medio)}, cerca de <b>${Math.ceil(falta/Math.max(medio,1))} conta(s) transferida(s)</b> fechariam a meta — caminho geralmente mais rápido que captar o mesmo valor em aportes. Em paralelo, ${saindo} conta(s) com saída líquida pedem retenção.`,sub:"captacao"});
        }
        const rec=G.linhas.find(l=>l.id==="receita");
        if(rec.at<100){
          const pac=contas.map(c=>pacoteDe(c)).filter(p=>p.itens.length>=2);
          acoes.push({t:"Receita",c:"green",d:`Faltam ${fmt(rec.meta-rec.real)}. A esteira tem ${pac.length} conta(s) com 2+ produtos, somando ${fmt(pac.reduce((s,p)=>s+p.receita,0))} de receita potencial — mais que suficiente se converter parte.`,sub:"receita"});
        }
        const iea=G.linhas.find(l=>l.id==="iea");
        if(iea.at<100){
          const d=R.iea.detalhe;
          const fraco = d.prospeccao < d.relacionamento ? "Prospecção" : "Relacionamento";
          const gap = iea.meta - d.total;
          acoes.push({t:"IEA",c:"sky",d:`Índice em ${fp(d.total)}, faltam <b>${fp(gap)}</b> para os ${iea.meta}% — e como a meta é binária, esses ${fp(gap)} valem os <b>${iea.peso} pontos inteiros</b>. O grupo mais fraco é ${fraco} (${fp(fraco==="Prospecção"?d.prospeccao:d.relacionamento)}). Os KPIs que o cockpit ajuda a mover são contas acessadas, ordens enviadas e aportes.`,sub:"iea"});
        }
        const seg=G.linhas.find(l=>l.id==="seguros");
        if(seg.at<100) acoes.push({t:"Seguros",c:"violet",d:`${seg.real} de ${seg.meta} agendamentos — faltam <b>${seg.meta-seg.real}</b>. Meta binária: fechar esses ${seg.meta-seg.real} vale ${seg.peso} pontos, parar antes vale zero. Contas acima de R$ 300 mil estão na fila de abordagem.`,sub:"seguros"});
        const nps=G.linhas.find(l=>l.id==="nps");
        if(nps.at<100) acoes.push({t:"NPS",c:"orange",d:`${R.nps.respostas} resposta(s)${R.nps.real!=null?`, score atual ${R.nps.real}`:" — nenhuma nota ainda"}. Meta binária de ${nps.meta}: ${R.nps.respostas===0?"basta registrar uma pesquisa com nota alta para os <b>"+nps.peso+" pontos</b>":"score precisa chegar a "+nps.meta}. Provavelmente a meta de menor esforço por ponto no seu mês.`,sub:"nps"});
        if(!acoes.length) return `<div class="empty">Todas as metas batidas. 🎯</div>`;
        return acoes.map(a=>`<div class="opcard" onclick="subMeta='${a.sub}';render('metas')">
          <div class="t"><span class="pill ${a.c}">${a.t}</span></div>
          <div class="d">${a.d}</div>
        </div>`).join("");
      })()}
    </div>

    <div class="card mt">
      <div class="sec">Configuração das metas</div>
      <div style="overflow-x:auto"><table>
        <tr><th>Meta</th><th class="r">Peso (%)</th><th class="r">Alvo</th><th>Apuração</th></tr>
        ${G.linhas.map(l=>`<tr>
          <td>${l.nome}</td>
          <td class="r"><input class="binput" style="width:70px;padding:4px 7px;font-size:12px;text-align:right" type="number" value="${l.peso}" onchange="setMeta('${l.id}','peso',this.value)"></td>
          <td class="r"><input class="binput" style="width:130px;padding:4px 7px;font-size:12px;text-align:right" type="number" value="${l.meta}" onchange="setMeta('${l.id}','meta',this.value)"></td>
          <td><label style="display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--mut);cursor:pointer">
            <input type="checkbox" ${l.binaria?"checked":""} onchange="toggleBinaria('${l.id}')" style="accent-color:var(--gold);width:14px;height:14px">
            ${l.binaria?"Binária (bateu = 100%)":"Proporcional"}
          </label></td>
        </tr>`).join("")}
        <tr><td style="color:var(--mut)">Soma dos pesos</td><td class="r" style="font-weight:700;color:${G.linhas.reduce((s,l)=>s+l.peso,0)===100?"var(--green)":"var(--red)"}">${G.linhas.reduce((s,l)=>s+l.peso,0)}%</td><td colspan="2"></td></tr>
      </table></div>
      <div class="hint">Metas <b>binárias</b> não têm meio-termo: bater vale o peso inteiro, ficar abaixo vale zero. Metas <b>proporcionais</b> pagam conforme o percentual atingido.</div>
    </div>`;
  }

  // ---------------- CAPTAÇÃO ----------------
  if(subMeta==="captacao"){
    const l = G.linhas.find(x=>x.id==="captacao");
    const porConta = contas.map(c=>({c, x:captacaoDe(c)})).filter(o=>o.x.entrada||o.x.saida)
      .sort((a,b)=>b.x.liquida-a.x.liquida);
    const saindo = porConta.filter(o=>o.x.liquida<0);
    const semFolga = contas.filter(c=>{const L=liqDe(c); return !L.intencional && L.pct<15 && c.patrimonio>100000;})
      .sort((a,b)=>b.patrimonio-a.patrimonio);
    const cap = R.captacao;
    return nav + `
    <div class="grid g4">
      <div class="card kpi"><div class="lbl">Captação total ${cap.manual!=null?'<span class="pill gold" style="font-size:9px">manual</span>':''}</div><div class="val ${cls(l.real)}">${fmt(l.real)}</div>
        <div class="meta-prog"><i style="width:${Math.max(Math.min(l.at,100),0)}%"></i></div>
        <div class="det">${fp(l.at)} da meta de ${fmtK(l.meta)}${cap.manual!=null?` · calculado: ${fmtK(cap.calculado)}`:''}</div></div>
      <div class="card kpi"><div class="lbl">Aportes dos clientes</div><div class="val ${cls(cap.aportes)}">${fmt(cap.aportes)}</div>
        <div class="det"><span class="pos">+${fmtK(cap.entradas)}</span> entradas · <span class="neg">-${fmtK(cap.saidas)}</span> saídas</div></div>
      <div class="card kpi"><div class="lbl">Transferências de carteira</div><div class="val ${cls(cap.transferencias)}">${fmt(cap.transferencias)}</div>
        <div class="det">${cap.nTransf} conta(s) registrada(s)</div></div>
      <div class="card kpi"><div class="lbl">Falta captar</div><div class="val" style="color:var(--gold)">${fmt(Math.max(l.meta-l.real,0))}</div>
        <div class="det">${l.real>0?`${fp(cap.aportes/l.real*100)} veio de aporte, ${fp(cap.transferencias/l.real*100)} de transferência`:`para fechar os ${l.peso}% do índice`}</div></div>
    </div>

    <div class="card mt">
      <div class="sec">Captação manual — sincronizar com a organização do escritório</div>
      <div class="hint" style="margin:0 0 12px">O cockpit calcula a captação a partir das movimentações importadas (${fmtK(cap.calculado)}). Se o número oficial do escritório for diferente, informe abaixo para o índice usar o valor manual e evitar descasamento. Deixe em branco para voltar ao cálculo automático.</div>
      <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
        <div><div class="blbl">Valor manual de captação (R$)</div>
          <input class="binput" type="number" id="cap_manual" placeholder="${cap.calculado}" value="${MET.captacaoManual!=null?MET.captacaoManual:''}" style="width:220px"></div>
        <button onclick="salvarCaptacaoManual()" style="background:var(--gold);color:#0B1220;border:none;border-radius:8px;padding:8px 16px;font-weight:700;cursor:pointer;margin-top:14px">Salvar valor manual</button>
        <button onclick="limparCaptacaoManual()" class="del" style="margin-top:14px">voltar ao automático</button>
        ${cap.manual!=null?`<span class="selo gold" style="margin-top:14px">● usando valor manual: ${fmt(cap.manual)}</span>`:''}
      </div>
    </div>

    <div class="card mt">
      <div class="sec">Transferências de carteira</div>
      <div class="hint" style="margin:0 0 12px">Contas que entraram na sua carteira contam integralmente como captação. Registre o código e o patrimônio na data da transferência — se deixar o valor em branco, o cockpit usa o patrimônio atual da conta.</div>
      <div style="display:grid;grid-template-columns:120px 130px 120px 150px 1fr auto;gap:8px;align-items:end">
        <div><div class="blbl">Conta</div><input class="binput" id="t_conta" placeholder="423875" list="lista_contas"></div>
        <div><div class="blbl">Data</div><input class="binput" type="date" id="t_data" value="${new Date().toISOString().slice(0,10)}"></div>
        <div><div class="blbl">Movimento</div><select class="binput" id="t_tipo"><option>Entrada</option><option>Saída</option></select></div>
        <div><div class="blbl">Valor (R$)</div><input class="binput" type="number" id="t_valor" placeholder="usa patrimônio atual"></div>
        <div><div class="blbl">Origem / observação</div><input class="binput" id="t_origem" placeholder="Ex: repasse do escritório, assessor anterior"></div>
        <button onclick="addTransf()" style="background:var(--gold);color:#0B1220;border:none;border-radius:8px;padding:9px 16px;font-weight:700;cursor:pointer;font-size:13px">+ Registrar</button>
      </div>
      <datalist id="lista_contas">${contas.map(c=>`<option value="${c.conta}">${fmtK(c.patrimonio)}</option>`).join("")}</datalist>
      ${(MET.transf||[]).length?`<div style="overflow-x:auto;margin-top:14px"><table>
        <tr><th>Data</th><th>Conta</th><th>Movimento</th><th class="r">Valor</th><th>Origem</th><th></th></tr>
        ${MET.transf.slice().sort((a,b)=>b.data.localeCompare(a.data)).map(t=>`<tr>
          <td style="color:var(--mut);white-space:nowrap">${t.data.split("-").reverse().join("/")}</td>
          <td style="font-weight:600;white-space:nowrap">${t.conta}${cpBtn(t.conta)}</td>
          <td><span class="pill ${t.valor>=0?"green":"red"}" style="font-size:9px">${t.tipo}</span></td>
          <td class="r ${cls(t.valor)}" style="font-weight:600">${fmt(t.valor)}</td>
          <td style="font-size:12px;color:var(--mut)">${t.origem||"—"}</td>
          <td><button class="del" onclick="delTransf(${t.id})">✕</button></td>
        </tr>`).join("")}
        <tr style="border-top:1px solid var(--line)"><td colspan="3" style="text-align:right;font-weight:600;color:var(--mut)">Total transferido</td>
          <td class="r ${cls(totalTransf())}" style="font-weight:800">${fmt(totalTransf())}</td><td colspan="2"></td></tr>
      </table></div>`:`<div class="hint" style="margin-top:12px">Nenhuma transferência registrada. Uma única conta de porte médio já representa parcela relevante da meta — por exemplo, ${fmtK(candidatosTransf()[0]?.patrimonio||0)} equivale a ${fp((candidatosTransf()[0]?.patrimonio||0)/l.meta*100)} do alvo.</div>`}
    </div>
    <div class="grid g2e mt">
      <div class="card">
        <div class="sec">Retenção — contas com saída líquida</div>
        <div class="hint" style="margin:0 0 10px">Segurar um resgate vale o mesmo que captar. Estas são as conversas mais urgentes do mês.</div>
        ${saindo.length?`<div style="max-height:320px;overflow-y:auto"><table>
          <tr><th>Conta</th><th class="r">Saída líquida</th><th class="r">Patrimônio</th><th>Relacionamento</th></tr>
          ${saindo.map(o=>{const Rl=relacionamento(o.c.conta);
            return `<tr class="click" onclick="abrirCliente('${o.c.conta}')">
            <td style="font-weight:600;white-space:nowrap">${o.c.conta}${cpBtn(o.c.conta)}</td>
            <td class="r neg">${fmt(o.x.liquida)}</td>
            <td class="r">${fmtK(o.c.patrimonio)}</td>
            <td><span class="pill ${Rl.cor}" style="font-size:9px">${Rl.status}</span></td></tr>`;}).join("")}
        </table></div>`:`<div class="empty">Nenhuma saída líquida no mês.</div>`}
      </div>
      <div class="card">
        <div class="sec">Candidatos a aporte externo</div>
        <div class="hint" style="margin:0 0 10px">Contas com pouca folga de caixa: se querem alocar, o dinheiro precisa vir de fora. São as conversas de captação, não de realocação.</div>
        <div style="max-height:320px;overflow-y:auto"><table>
          <tr><th>Conta</th><th class="r">Patrimônio</th><th class="r">Caixa real</th><th>Sinais</th></tr>
          ${semFolga.slice(0,20).map(c=>{const L=liqDe(c);
            return `<tr class="click" onclick="abrirCliente('${c.conta}')">
            <td style="font-weight:600;white-space:nowrap">${c.conta}${cpBtn(c.conta)}</td>
            <td class="r">${fmtK(c.patrimonio)}</td>
            <td class="r" style="color:var(--mut)">${fp(L.pct)}</td>
            <td>${c.flags.filter(f=>!f.gld).slice(0,2).map(f=>`<span class="pill ${f.cor}" style="font-size:9px">${f.tag}</span>`).join(" ")}</td></tr>`;}).join("")}
        </table></div>
      </div>
    </div>
    <div class="card mt">
      <div class="sec">Movimentação por conta</div>
      <div style="max-height:400px;overflow-y:auto"><table>
        <tr><th>Conta</th><th class="r">Entradas</th><th class="r">Saídas</th><th class="r">Líquida</th></tr>
        ${porConta.map(o=>`<tr class="click" onclick="abrirCliente('${o.c.conta}')">
          <td style="font-weight:600;white-space:nowrap">${o.c.conta}${cpBtn(o.c.conta)}</td>
          <td class="r pos">${o.x.entrada?fmt(o.x.entrada):"—"}</td>
          <td class="r neg">${o.x.saida?fmt(o.x.saida):"—"}</td>
          <td class="r ${cls(o.x.liquida)}" style="font-weight:600">${fmt(o.x.liquida)}</td>
        </tr>`).join("")}
      </table></div>
    </div>`;
  }

  // ---------------- IEA ----------------
  if(subMeta==="iea"){
    const l = G.linhas.find(x=>x.id==="iea");
    const d = R.iea.detalhe;
    const semOrdem = contas.filter(c=>!(c.movimentacoes||[]).some(m=>/COMPRA|VENDA|APLICA|SUBSCRI/i.test(m.historico)));
    const semAporte = contas.filter(c=>captacaoDe(c).entrada<=0);
    return nav + `
    <div class="grid g4">
      <div class="card kpi"><div class="lbl">IEA calculado</div><div class="val" style="color:${l.at>=100?"var(--green)":"var(--gold)"}">${fp(d.total)}</div>
        <div class="meta-prog"><i style="width:${l.prog}%"></i></div>
        <div class="det">${l.at>=100?`acima de ${l.meta}% · ${l.peso} pontos garantidos`:`meta ${l.meta}% · faltam ${fp(l.meta-d.total)} · binária`}</div></div>
      <div class="card kpi"><div class="lbl">Esforço Prospecção</div><div class="val" style="color:var(--sky)">${fp(d.prospeccao)}</div><div class="det">peso 50% no índice</div></div>
      <div class="card kpi"><div class="lbl">Esforço Relacionamento</div><div class="val" style="color:var(--violet)">${fp(d.relacionamento)}</div><div class="det">peso 50% no índice</div></div>
      <div class="card kpi"><div class="lbl">Contas na carteira</div><div class="val">${contas.length}</div><div class="det">base para os KPIs percentuais</div></div>
    </div>

    <div class="card mt">
      <div class="sec">KPIs do índice — informe padrão esperado e realizado</div>
      <div class="hint" style="margin:0 0 12px">Os números vêm do painel da XP. Preencha o <b>padrão</b> (meta da faixa de tempo) e o <b>realizado</b>; o atingimento e a composição são calculados aqui.</div>
      <div style="overflow-x:auto"><table>
        <tr><th>KPI</th><th>Grupo</th><th class="r">Peso</th><th class="r">Padrão</th><th class="r">Realizado</th><th class="r">Atingimento</th><th style="min-width:110px"></th></tr>
        ${IEA_KPIS.map(k=>{
          const v = MET.iea[k.id]||{};
          const padrao=v.padrao||0, real=v.real||0;
          const at = padrao>0?Math.min(real/padrao*100,150):0;
          return `<tr>
            <td style="font-weight:600">${k.nome}</td>
            <td><span class="pill ${k.grupo==="Prospecção"?"sky":"violet"}" style="font-size:9px">${k.grupo}</span></td>
            <td class="r" style="color:var(--mut)">${k.peso}%</td>
            <td class="r"><input class="binput" style="width:80px;padding:4px 7px;font-size:12px;text-align:right" type="number" step="any" value="${padrao||""}" onchange="setIEA('${k.id}','padrao',this.value)"></td>
            <td class="r"><input class="binput" style="width:80px;padding:4px 7px;font-size:12px;text-align:right" type="number" step="any" value="${real||""}" onchange="setIEA('${k.id}','real',this.value)"></td>
            <td class="r" style="font-weight:600;color:${at>=100?"var(--green)":at>=60?"var(--gold)":"var(--red)"}">${padrao?fp(at):"—"}</td>
            <td><div class="bar"><i style="width:${Math.min(at,100)}%;background:${at>=100?"var(--green)":at>=60?"var(--gold)":"var(--red)"}"></i></div></td>
          </tr>`;
        }).join("")}
      </table></div>
    </div>

    <div class="grid g2e mt">
      <div class="card">
        <div class="sec">Contas sem ordem enviada no mês</div>
        <div class="hint" style="margin:0 0 10px">KPI "% Contas com Ordens Enviadas" — peso 30% dentro de Relacionamento. Estas ${semOrdem.length} conta(s) ainda não têm ordem registrada no relatório.</div>
        <div style="max-height:300px;overflow-y:auto"><table>
          <tr><th>Conta</th><th class="r">Patrimônio</th><th>Pauta disponível</th></tr>
          ${semOrdem.sort((a,b)=>b.patrimonio-a.patrimonio).slice(0,25).map(c=>{
            const pk=pacoteDe(c);
            return `<tr class="click" onclick="abrirCliente('${c.conta}')">
              <td style="font-weight:600;white-space:nowrap">${c.conta}${cpBtn(c.conta)}</td>
              <td class="r">${fmtK(c.patrimonio)}</td>
              <td>${pk.itens.length?`<span class="pill green" style="font-size:9px">${pk.itens.length} produto(s)</span>`:`<span class="pill mut" style="font-size:9px">sem match</span>`}</td>
            </tr>`;}).join("")}
        </table></div>
      </div>
      <div class="card">
        <div class="sec">Contas sem aporte no mês</div>
        <div class="hint" style="margin:0 0 10px">KPI "% Contas que Aportaram" — peso 40%, o maior de Relacionamento. Também é o que mais ajuda na meta de captação.</div>
        <div style="max-height:300px;overflow-y:auto"><table>
          <tr><th>Conta</th><th class="r">Patrimônio</th><th>Relacionamento</th></tr>
          ${semAporte.sort((a,b)=>b.patrimonio-a.patrimonio).slice(0,25).map(c=>{const Rl=relacionamento(c.conta);
            return `<tr class="click" onclick="abrirCliente('${c.conta}')">
              <td style="font-weight:600;white-space:nowrap">${c.conta}${cpBtn(c.conta)}</td>
              <td class="r">${fmtK(c.patrimonio)}</td>
              <td><span class="pill ${Rl.cor}" style="font-size:9px">${Rl.status}</span></td>
            </tr>`;}).join("")}
        </div></table></div>
      </div>
    </div>`;
  }

  // ---------------- SEGUROS ----------------
  if(subMeta==="seguros"){
    const l = G.linhas.find(x=>x.id==="seguros");
    const candidatos = contas.filter(c=>c.patrimonio>300000 && !MET.seguros.some(s=>s.conta===c.conta))
      .sort((a,b)=>b.patrimonio-a.patrimonio);
    return nav + `
    <div class="grid g4">
      <div class="card kpi"><div class="lbl">Agendamentos</div><div class="val" style="color:${l.at>=100?"var(--green)":"var(--violet)"}">${l.real} <span style="font-size:14px;color:var(--dim)">/ ${l.meta}</span></div>
        <div class="meta-prog"><i style="width:${l.prog}%"></i></div>
        <div class="det">${l.at>=100?`meta batida · ${l.peso} pontos garantidos`:`progresso ${fp(l.prog)} · ainda vale 0 pontos`}</div></div>
      <div class="card kpi"><div class="lbl">Faltam</div><div class="val" style="color:${l.at>=100?"var(--green)":"var(--gold)"}">${Math.max(l.meta-l.real,0)}</div>
        <div class="det">${l.at>=100?"meta cumprida":`meta binária — os ${l.peso} pontos só entram ao chegar em ${l.meta}`}</div></div>
      <div class="card kpi"><div class="lbl">Realizados</div><div class="val pos">${MET.seguros.filter(s=>s.status==="Realizado").length}</div><div class="det">reuniões concluídas</div></div>
      <div class="card kpi"><div class="lbl">Candidatos</div><div class="val">${candidatos.length}</div><div class="det">contas &gt; R$ 300 mil sem agendamento</div></div>
    </div>
    <div class="card mt">
      <div class="sec">Registrar agendamento</div>
      <div style="display:grid;grid-template-columns:120px 130px 150px 150px 1fr auto;gap:8px;align-items:end">
        <div><div class="blbl">Conta</div><input class="binput" id="s_conta" placeholder="423875"></div>
        <div><div class="blbl">Data</div><input class="binput" type="date" id="s_data" value="${new Date().toISOString().slice(0,10)}"></div>
        <div><div class="blbl">Tipo</div><select class="binput" id="s_tipo">${["Vida","Previdência","Residencial","Auto","Saúde","Empresarial"].map(t=>`<option>${t}</option>`).join("")}</select></div>
        <div><div class="blbl">Status</div><select class="binput" id="s_status">${["Agendado","Realizado","Proposta enviada","Fechado","Cancelado"].map(t=>`<option>${t}</option>`).join("")}</select></div>
        <div><div class="blbl">Observação</div><input class="binput" id="s_obs" placeholder="Contexto, perfil familiar…"></div>
        <button onclick="addSeguro()" style="background:var(--violet);color:#0B1220;border:none;border-radius:8px;padding:9px 16px;font-weight:700;cursor:pointer;font-size:13px">+ Agendar</button>
      </div>
      ${MET.seguros.length?`<div style="overflow-x:auto;margin-top:14px"><table>
        <tr><th>Data</th><th>Conta</th><th>Tipo</th><th>Status</th><th>Observação</th><th></th></tr>
        ${MET.seguros.slice().sort((a,b)=>b.data.localeCompare(a.data)).map(s=>`<tr>
          <td style="color:var(--mut);white-space:nowrap">${s.data.split("-").reverse().join("/")}</td>
          <td style="font-weight:600;white-space:nowrap">${s.conta}${cpBtn(s.conta)}</td>
          <td><span class="pill violet" style="font-size:9px">${s.tipo}</span></td>
          <td><select class="binput" style="padding:3px 6px;font-size:11px;width:130px" onchange="statusSeguro(${s.id},this.value)">
            ${["Agendado","Realizado","Proposta enviada","Fechado","Cancelado"].map(t=>`<option ${s.status===t?"selected":""}>${t}</option>`).join("")}</select></td>
          <td style="font-size:12px;color:var(--mut)">${s.obs||"—"}</td>
          <td><button class="del" onclick="delSeguro(${s.id})">✕</button></td>
        </tr>`).join("")}
      </table></div>`:`<div class="hint" style="margin-top:12px">Nenhum agendamento registrado ainda.</div>`}
    </div>
    <div class="card mt">
      <div class="sec">Fila de abordagem</div>
      <div class="hint" style="margin:0 0 10px">Contas acima de R$ 300 mil ainda sem agendamento, ordenadas por patrimônio. Quem tem mais a proteger costuma ouvir melhor a conversa de seguro.</div>
      <div style="max-height:340px;overflow-y:auto"><table>
        <tr><th>Conta</th><th class="r">Patrimônio</th><th>Relacionamento</th><th>Contexto</th></tr>
        ${candidatos.slice(0,25).map(c=>{const Rl=relacionamento(c.conta); const notas=notasDe(c.conta);
          return `<tr class="click" onclick="abrirCliente('${c.conta}')">
          <td style="font-weight:600;white-space:nowrap">${c.conta}${cpBtn(c.conta)}</td>
          <td class="r">${fmtK(c.patrimonio)}</td>
          <td><span class="pill ${Rl.cor}" style="font-size:9px">${Rl.status}</span></td>
          <td style="font-size:11.5px;color:var(--mut)">${notas.length?notas[0].texto.slice(0,60)+(notas[0].texto.length>60?"…":""):"sem registro de contato"}</td>
        </tr>`;}).join("")}
      </table></div>
    </div>`;
  }

  // ---------------- NPS ----------------
  if(subMeta==="nps"){
    const l = G.linhas.find(x=>x.id==="nps");
    const n = R.nps;
    const propensos = contas.filter(c=>{
      const Rl=relacionamento(c.conta);
      const bom = c.portfolio?.m12!=null && c.cdi?.m12!=null && c.portfolio.m12>=c.cdi.m12;
      return bom && Rl.dias!=null && Rl.dias<=60 && !MET.nps.some(x=>x.conta===c.conta);
    }).sort((a,b)=>b.patrimonio-a.patrimonio);
    const risco = contas.filter(c=>c.flags.some(f=>/Abaixo do CDI|Saída de recursos|Posições em perda/.test(f.tag)));
    return nav + `
    <div class="grid g4">
      <div class="card kpi"><div class="lbl">NPS</div><div class="val" style="color:${l.at>=100?"var(--green)":"var(--gold)"}">${n.real!=null?n.real:"—"}</div>
        <div class="meta-prog"><i style="width:${l.prog}%"></i></div>
        <div class="det">${l.at>=100?`acima de ${l.meta} · ${l.peso} pontos garantidos`:`meta ${l.meta} · ${n.respostas} resposta(s) · binária`}</div></div>
      <div class="card kpi"><div class="lbl">Promotores</div><div class="val pos">${n.promotores}</div><div class="det">notas 9 e 10</div></div>
      <div class="card kpi"><div class="lbl">Detratores</div><div class="val neg">${n.detratores}</div><div class="det">notas de 0 a 6</div></div>
      <div class="card kpi"><div class="lbl">Neutros</div><div class="val">${n.respostas-n.promotores-n.detratores}</div><div class="det">notas 7 e 8 (não contam)</div></div>
    </div>
    <div class="card mt">
      <div class="sec">Registrar resposta</div>
      <div style="display:grid;grid-template-columns:130px 90px 1fr auto;gap:8px;align-items:end">
        <div><div class="blbl">Conta</div><input class="binput" id="n_conta" placeholder="423875"></div>
        <div><div class="blbl">Nota (0–10)</div><input class="binput" type="number" min="0" max="10" id="n_nota"></div>
        <div><div class="blbl">Comentário</div><input class="binput" id="n_com" placeholder="O que o cliente falou"></div>
        <button onclick="addNPS()" style="background:var(--orange);color:#0B1220;border:none;border-radius:8px;padding:9px 16px;font-weight:700;cursor:pointer;font-size:13px">+ Registrar</button>
      </div>
      ${MET.nps.length?`<div style="overflow-x:auto;margin-top:14px"><table>
        <tr><th>Data</th><th>Conta</th><th class="r">Nota</th><th>Classificação</th><th>Comentário</th><th></th></tr>
        ${MET.nps.slice().sort((a,b)=>b.data.localeCompare(a.data)).map(x=>{
          const cls2 = x.nota>=9?["green","Promotor"]:x.nota<=6?["red","Detrator"]:["mut","Neutro"];
          return `<tr>
          <td style="color:var(--mut);white-space:nowrap">${x.data.split("-").reverse().join("/")}</td>
          <td style="font-weight:600;white-space:nowrap">${x.conta||"—"}${x.conta?cpBtn(x.conta):""}</td>
          <td class="r" style="font-weight:700">${x.nota}</td>
          <td><span class="pill ${cls2[0]}" style="font-size:9px">${cls2[1]}</span></td>
          <td style="font-size:12px;color:var(--mut)">${x.comentario||"—"}</td>
          <td><button class="del" onclick="delNPS(${x.id})">✕</button></td>
        </tr>`;}).join("")}
      </table></div>`:`<div class="hint" style="margin-top:12px">Nenhuma resposta registrada.</div>`}
    </div>
    <div class="grid g2e mt">
      <div class="card">
        <div class="sec">Mais propensos a nota alta</div>
        <div class="hint" style="margin:0 0 10px">Rentabilidade acima do CDI e contato recente. São os que você quer que respondam a pesquisa.</div>
        <div style="max-height:300px;overflow-y:auto"><table>
          <tr><th>Conta</th><th class="r">Patrimônio</th><th class="r">12M vs CDI</th><th>Últ. contato</th></tr>
          ${propensos.slice(0,20).map(c=>{const Rl=relacionamento(c.conta);
            return `<tr class="click" onclick="abrirCliente('${c.conta}')">
            <td style="font-weight:600;white-space:nowrap">${c.conta}${cpBtn(c.conta)}</td>
            <td class="r">${fmtK(c.patrimonio)}</td>
            <td class="r pos">+${fp((c.portfolio?.m12||0)-(c.cdi?.m12||0))}</td>
            <td style="color:var(--mut);font-size:12px">${Rl.dias}d</td></tr>`;}).join("")}
        </table></div>
      </div>
      <div class="card">
        <div class="sec">Atenção antes de pesquisar</div>
        <div class="hint" style="margin:0 0 10px">${risco.length} conta(s) com rentabilidade abaixo do CDI, saída de recursos ou posições em perda. Resolver a insatisfação antes de pedir nota é mais produtivo que arriscar um detrator.</div>
        <div style="max-height:300px;overflow-y:auto"><table>
          <tr><th>Conta</th><th class="r">Patrimônio</th><th>Motivo</th></tr>
          ${risco.sort((a,b)=>b.patrimonio-a.patrimonio).slice(0,20).map(c=>`<tr class="click" onclick="abrirCliente('${c.conta}')">
            <td style="font-weight:600;white-space:nowrap">${c.conta}${cpBtn(c.conta)}</td>
            <td class="r">${fmtK(c.patrimonio)}</td>
            <td>${c.flags.filter(f=>/Abaixo do CDI|Saída de recursos|Posições em perda/.test(f.tag)).map(f=>`<span class="pill ${f.cor}" style="font-size:9px">${f.tag}</span>`).join(" ")}</td>
          </tr>`).join("")}
        </table></div>
      </div>
    </div>`;
  }

  // ---------------- HISTÓRICO ----------------
  if(subMeta==="hist"){
    const H = MET.historico.slice().sort((a,b)=>a.mes.localeCompare(b.mes));
    const jaFechado = MET.historico.some(h=>h.mes===mesAtual());
    const chaves = ["captacao","receita","iea","seguros","nps"];
    // gráfico de linha do índice
    const graf = (()=>{
      if(H.length===0) return "";
      if(H.length===1){
        const x=H[0];
        return `<div style="text-align:center;padding:24px 0">
          <div style="font-size:34px;font-weight:800;color:${x.indice>=100?'var(--green)':'var(--gold)'}">${fp(x.indice)}</div>
          <div style="color:var(--mut);font-size:12px">${rotuloMes(x.mes)} · primeiro mês registrado</div>
          <div class="hint" style="margin-top:8px">Registre pelo menos mais um mês para o cockpit desenhar a linha de evolução do índice.</div>
        </div>`;
      }
      const w=680,h=170,pad=28;
      const vals=H.map(x=>x.indice);
      const mx=Math.max(...vals,100), mn=Math.min(...vals,0);
      const rg=(mx-mn)||1;
      const px=i=>pad+(i/(H.length-1))*(w-pad*2);
      const py=v=>h-pad-((v-mn)/rg)*(h-pad*2);
      const pts=H.map((x,i)=>`${px(i).toFixed(1)},${py(x.indice).toFixed(1)}`).join(" ");
      const y100=py(100);
      return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto">
        ${y100>pad&&y100<h-pad?`<line x1="${pad}" y1="${y100}" x2="${w-pad}" y2="${y100}" stroke="var(--green)" stroke-width="1" stroke-dasharray="4 4" opacity=".5"/>
        <text x="${w-pad}" y="${y100-5}" fill="var(--green)" font-size="10" text-anchor="end">meta 100%</text>`:""}
        <polyline points="${pts}" fill="none" stroke="var(--gold)" stroke-width="2.5" stroke-linejoin="round"/>
        ${H.map((x,i)=>`<circle cx="${px(i).toFixed(1)}" cy="${py(x.indice).toFixed(1)}" r="4" fill="${x.indice>=100?"var(--green)":"var(--gold)"}"/>
          <text x="${px(i).toFixed(1)}" y="${(py(x.indice)-11).toFixed(1)}" fill="var(--txt)" font-size="10.5" text-anchor="middle" font-weight="600">${fp(x.indice)}</text>
          <text x="${px(i).toFixed(1)}" y="${h-8}" fill="var(--dim)" font-size="10" text-anchor="middle">${rotuloMes(x.mes)}</text>`).join("")}
      </svg>`;
    })();
    const media = H.length? H.reduce((s,x)=>s+x.indice,0)/H.length : 0;
    const melhor = H.length? H.reduce((a,b)=>b.indice>a.indice?b:a) : null;
    const ultimo = H.length? H[H.length-1] : null;
    const penult = H.length>1? H[H.length-2] : null;
    return nav + `
    <div class="grid g4">
      <div class="card kpi"><div class="lbl">Meses registrados</div><div class="val">${H.length}</div><div class="det">${H.length?`de ${rotuloMes(H[0].mes)} a ${rotuloMes(H[H.length-1].mes)}`:"nenhum fechamento ainda"}</div></div>
      <div class="card kpi"><div class="lbl">Média do índice</div><div class="val" style="color:${media>=100?"var(--green)":"var(--gold)"}">${fp(media)}</div><div class="det">${H.filter(x=>x.indice>=100).length} mês(es) acima de 100%</div></div>
      <div class="card kpi"><div class="lbl">Melhor mês</div><div class="val" style="color:var(--green);font-size:18px">${melhor?rotuloMes(melhor.mes):"—"}</div><div class="det">${melhor?fp(melhor.indice):""}</div></div>
      <div class="card kpi"><div class="lbl">Variação</div><div class="val ${penult&&ultimo?cls(ultimo.indice-penult.indice):""}">${penult&&ultimo?(ultimo.indice-penult.indice>=0?"+":"")+fp(ultimo.indice-penult.indice):"—"}</div><div class="det">${penult&&ultimo?`${rotuloMes(penult.mes)} → ${rotuloMes(ultimo.mes)}`:"precisa de 2 meses"}</div></div>
    </div>

    <div class="card mt">
      <div class="sec">Fechar o mês</div>
      <div style="display:flex;gap:10px;align-items:end;flex-wrap:wrap">
        <div><div class="blbl">Mês de referência</div>
          <input class="binput" type="month" id="h_mes" value="${mesAtual()}" style="width:160px"></div>
        <button onclick="fecharMes(false)" style="background:var(--gold);color:#0B1220;border:none;border-radius:9px;padding:10px 18px;font-weight:700;cursor:pointer;font-size:13px">
          ${jaFechado?"↻ Atualizar fechamento":"✓ Registrar fechamento"}</button>
        <button onclick="if(confirm('Registrar o fechamento E zerar boletas, seguros, NPS e transferências para começar o próximo mês?\n\nO histórico fica salvo; só os lançamentos correntes são limpos.'))fecharMes(true)"
          style="background:var(--panel2);border:1px solid var(--line);color:var(--mut);border-radius:9px;padding:10px 16px;font-size:12.5px;cursor:pointer">Fechar e zerar o mês</button>
        <span class="sub" style="margin-left:auto">Índice atual: <b style="color:${G.total>=100?"var(--green)":"var(--gold)"}">${fp(G.total)}</b></span>
      </div>
      <div class="hint">O fechamento salva uma foto do mês: índice, cada meta com realizado e pontos, AUM e número de contas. Registrar o mesmo mês de novo sobrescreve a foto anterior — dá para ir salvando ao longo do mês sem problema.</div>
    </div>

    ${graf?`<div class="card mt"><div class="sec">Evolução do índice</div>${graf}</div>`:""}

    ${H.length?`<div class="card mt">
      <div class="sec" style="display:flex;align-items:center;justify-content:space-between">Resultado mês a mês
        <button class="del" onclick="limparHistorico()" style="font-size:11px;padding:3px 10px">limpar histórico</button></div>
      <div style="overflow-x:auto"><table>
        <tr><th>Mês</th><th class="r">Índice</th>${chaves.map(k=>`<th class="r">${((MET.metas[k]||{}).nome||k).split(" ")[0]}</th>`).join("")}<th class="r">AUM</th><th class="r">Contas</th><th></th></tr>
        ${MET.historico.map(h=>`<tr>
          <td style="font-weight:600">${rotuloMes(h.mes)}<div style="font-size:10px;color:var(--dim)">${h.fechadoEm?("fechado "+h.fechadoEm.split("-").reverse().join("/")):"registro incompleto"}</div></td>
          <td class="r" style="font-weight:800;color:${(h.indice||0)>=100?"var(--green)":(h.indice||0)>=70?"var(--gold)":"var(--red)"}">${h.indice!=null?fp(h.indice):"—"}</td>
          ${chaves.map(k=>{const m=(h.metas||{})[k];
            if(!m) return `<td class="r" style="color:var(--dim)">—</td>`;
            return `<td class="r" title="${m.nome}: ${fmtMeta(m.real,m.tipo)} de ${fmtMeta(m.meta,m.tipo)}">
              <span style="color:${m.at>=100?"var(--green)":"var(--mut)"}">${fp(m.pontos)}</span>
              <div style="font-size:9.5px;color:var(--dim)">de ${m.peso}%</div></td>`;}).join("")}
          <td class="r" style="color:var(--mut)">${h.aum!=null?fmtK(h.aum):"—"}</td>
          <td class="r" style="color:var(--mut)">${h.contas!=null?h.contas:"—"}</td>
          <td><button class="del" onclick="event.stopPropagation();delHistorico('${h.mes}')">✕</button></td>
        </tr>`).join("")}
      </table></div>
      <div class="hint">Cada célula mostra os pontos conquistados sobre o peso da meta. Passe o mouse para ver o realizado contra o alvo.</div>
    </div>

    <div class="card mt">
      <div class="sec">Detalhe por mês</div>
      <div style="overflow-x:auto"><table>
        <tr><th>Mês</th><th class="r">Aportes</th><th class="r">Transferências</th><th class="r">Boletas</th><th class="r">Volume boletado</th><th class="r">IEA Prosp.</th><th class="r">IEA Relac.</th><th class="r">Seguros</th><th class="r">NPS resp.</th></tr>
        ${MET.historico.map(h=>{const d=h.detalhe||{};
          return `<tr>
          <td style="font-weight:600">${rotuloMes(h.mes)}</td>
          <td class="r ${cls(d.aportes)}">${d.aportes!=null?fmt(d.aportes):"—"}</td>
          <td class="r ${cls(d.transferencias)}">${d.transferencias!=null?fmt(d.transferencias):"—"}</td>
          <td class="r" style="color:var(--mut)">${d.boletas??"—"}</td>
          <td class="r">${d.volumeBoletado!=null?fmt(d.volumeBoletado):"—"}</td>
          <td class="r" style="color:var(--sky)">${d.iea?fp(d.iea.prospeccao):"—"}</td>
          <td class="r" style="color:var(--violet)">${d.iea?fp(d.iea.relacionamento):"—"}</td>
          <td class="r" style="color:var(--mut)">${d.seguros??"—"}</td>
          <td class="r" style="color:var(--mut)">${d.npsRespostas??"—"}</td>
        </tr>`;}).join("")}
      </table></div>
    </div>`:`<div class="card mt"><div class="empty">Nenhum mês fechado ainda. Registre o fechamento acima para começar a série.</div></div>`}`;
  }

  // ---------------- RECEITA ----------------
  const potPorClasse = {};
  contas.forEach(c=>c.flags.forEach(f=>{
    if(!f.valor || !f.prods.length) return;
    const p = PRODUTOS.find(x=>x.id===f.prods[0]);
    if(p) potPorClasse[p.classeMeta] = (potPorClasse[p.classeMeta]||0) + f.valor;
  }));
  const receitaPot = METAS.reduce((s,m)=>s+Math.min(potPorClasse[m.classe]||0, m.volume*2)*m.roa/100,0);
  const lr = G.linhas.find(x=>x.id==="receita");
  const realizado = lr.real;
  const pctMeta = lr.at;
  return nav + `
  <div class="grid g4">
    <div class="card kpi"><div class="lbl">Receita realizada</div><div class="val pos">${fmt(realizado)}</div>
      <div class="meta-prog"><i style="width:${Math.min(pctMeta,100)}%"></i></div>
      <div class="det">${fp(pctMeta)} da meta · falta ${fmt(Math.max(lr.meta-realizado,0))}</div></div>
    <div class="card kpi"><div class="lbl">Meta de receita</div><div class="val" style="color:var(--gold)">${fmt(lr.meta)}</div><div class="det">peso ${lr.peso}% no índice geral</div></div>
    <div class="card kpi"><div class="lbl">Potencial no radar</div><div class="val" style="color:var(--sky)">${fmt(receitaPot)}</div><div class="det">${fp(receitaPot/lr.meta*100)} da meta, se convertido</div></div>
    <div class="card kpi"><div class="lbl">Volume identificado</div><div class="val">${fmtK(Object.values(potPorClasse).reduce((s,v)=>s+v,0))}</div><div class="det">nas ${contas.length} contas</div></div>
  </div>
<div class="card mt">
    <div class="sec">Controle de boletas</div>
    <div class="bform">
      <div><div class="blbl">Data</div><input class="binput" type="date" id="b_data" value="${new Date().toISOString().slice(0,10)}"></div>
      <div><div class="blbl">Conta</div><input class="binput" id="b_conta" placeholder="423875"></div>
      <div><div class="blbl">Classe</div><select class="binput" id="b_classe" onchange="autoReceita()">${METAS.map(m=>`<option>${m.classe}</option>`).join("")}</select></div>
      <div><div class="blbl">Produto</div><input class="binput" id="b_prod" placeholder="Ex: RIZARI, GLD, CDB…"></div>
      <div><div class="blbl">Volume (R$)</div><input class="binput" type="number" id="b_vol" oninput="autoReceita()" placeholder="50000"></div>
      <div><div class="blbl">Receita (R$)</div><input class="binput" type="number" id="b_rec" placeholder="auto pelo ROA"></div>
      <div><button onclick="addBoleta()" style="background:var(--gold);color:#0B1220;border:none;border-radius:8px;padding:9px 16px;font-weight:600;cursor:pointer;font-size:13px">+ Boletar</button></div>
    </div>
    <div style="display:flex;align-items:center;gap:8px;margin-top:12px;font-size:12px;color:var(--mut)">
      Receita fora do cockpit (ajuste inicial):
      <input class="binput" type="number" style="width:120px" value="${BOL.ajuste||0}" onchange="setAjuste(this.value)">
      <span class="hint" style="margin-top:0">— já contabiliza os ~R$ 17 mil que você fez este mês; edite quando quiser.</span>
    </div>
    ${BOL.itens.length?`<div style="overflow-x:auto;margin-top:12px"><table>
      <tr><th>Data</th><th>Conta</th><th>Classe</th><th>Produto</th><th class="r">Volume</th><th class="r">Receita</th><th></th></tr>
      ${BOL.itens.map(b=>`<tr>
        <td style="color:var(--mut);white-space:nowrap">${b.data?b.data.split("-").reverse().join("/"):"—"}</td>
        <td style="font-weight:600;white-space:nowrap">${b.conta||"—"}${b.conta?cpBtn(b.conta):""}</td>
        <td style="color:var(--mut)">${b.classe}</td><td>${b.produto||"—"}</td>
        <td class="r">${fmt(b.volume)}</td><td class="r pos" style="font-weight:600">${fmt(b.receita)}</td>
        <td><button class="del" onclick="delBoleta(${b.id})" title="Excluir">✕</button></td>
      </tr>`).join("")}
      <tr><td colspan="4" style="text-align:right;color:var(--mut);font-weight:600">Total boletado</td>
        <td class="r" style="font-weight:700">${fmt(BOL.itens.reduce((s,b)=>s+(b.volume||0),0))}</td>
        <td class="r pos" style="font-weight:700">${fmt(BOL.itens.reduce((s,b)=>s+(b.receita||0),0))}</td><td></td></tr>
    </table></div>`:`<div class="hint" style="margin-top:12px">Nenhuma boleta registrada ainda — lance a primeira acima. A receita é calculada automaticamente pelo ROA da classe, mas você pode sobrescrever.</div>`}
  </div>
  <div class="card mt">
    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px">
      <div class="sec" style="margin:0">Mix de alocação — meta vs potencial do radar</div>
      <button onclick="addClasseMix()" style="background:var(--panel2);border:1px solid var(--line);color:var(--gold);border-radius:8px;padding:5px 12px;font-size:11.5px;cursor:pointer">+ Classe</button>
      <button onclick="if(confirm('Restaurar o mix padrão? As alterações serão perdidas.'))resetMix()" style="background:none;border:none;color:var(--dim);font-size:11px;cursor:pointer">restaurar padrão</button>
      <span class="sub" style="margin-left:auto">Volume e receita são calculados: receita = meta × %mix · volume = receita ÷ ROA</span>
    </div>
    <div style="overflow-x:auto"><table>
      <tr><th>Classe</th><th class="r">ROA %</th><th class="r">% Mix</th><th class="r">Volume meta</th><th class="r">Receita meta</th><th class="r">Boletado</th><th class="r">Potencial radar</th><th style="min-width:120px">Cobertura</th><th></th></tr>
      ${mixCalculado().map((m,i)=>{
        const pot = potPorClasse[m.classe]||0;
        const cob = Math.min(pot/m.volume*100,999);
        const bolCls = BOL.itens.filter(b=>b.classe===m.classe).reduce((s,b)=>s+(b.receita||0),0);
        return `<tr>
          <td><input class="binput" style="width:190px;padding:4px 8px;font-size:12px;font-weight:600" value="${m.classe}" onchange="setMix(${i},'classe',this.value)"></td>
          <td class="r"><input class="binput" style="width:62px;padding:4px 7px;font-size:12px;text-align:right" type="number" step="0.1" value="${m.roa}" onchange="setMix(${i},'roa',this.value)"></td>
          <td class="r"><input class="binput" style="width:62px;padding:4px 7px;font-size:12px;text-align:right" type="number" step="1" value="${m.aloc}" onchange="setMix(${i},'aloc',this.value)"></td>
          <td class="r">${fmt(m.volume)}</td>
          <td class="r" style="color:var(--gold)">${fmt(m.receita)}</td>
          <td class="r ${bolCls?"pos":""}">${bolCls?fmt(bolCls):"—"}</td>
          <td class="r ${pot>=m.volume?"pos":""}">${pot?fmtK(pot):"—"}</td>
          <td><div class="meta-prog"><i style="width:${Math.min(cob,100)}%"></i></div><div style="font-size:10px;color:var(--dim);margin-top:2px">${cob?fp(Math.min(cob,999)):"0%"} do volume</div></td>
          <td><button class="del" onclick="delClasseMix(${i})" title="Remover classe">✕</button></td>
        </tr>`;
      }).join("")}
      ${(()=>{const mc=mixCalculado(); const somaAloc=mc.reduce((s,m)=>s+m.aloc,0);
        return `<tr style="border-top:1px solid var(--line)"><td style="font-weight:700">TOTAL</td><td></td>
        <td class="r" style="font-weight:700;color:${Math.round(somaAloc)===100?"var(--green)":"var(--red)"}">${somaAloc}%</td>
        <td class="r" style="font-weight:700">${fmt(mc.reduce((s,m)=>s+m.volume,0))}</td>
        <td class="r" style="font-weight:700;color:var(--gold)">${fmt(mc.reduce((s,m)=>s+m.receita,0))}</td>
        <td class="r pos" style="font-weight:700">${fmt(BOL.itens.reduce((s,b)=>s+(b.receita||0),0))}</td><td colspan="3"></td></tr>`;})()}
    </table></div>
    <div class="hint">Classe, ROA e % do mix são editáveis — ajuste a cada mês. <b>Volume e receita se recalculam sozinhos</b> a partir da meta de receita definida no Painel Geral (${fmt(MET.metas.receita.meta)}). A soma dos percentuais deve fechar 100%. Cobertura = potencial identificado pelo radar ÷ volume da meta; classes sem produto cadastrado aparecem zeradas.</div>
  </div>
  <div class="card mt">
    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px">
      <div class="sec" style="margin:0">Cadastro de produtos</div>
      <button onclick="document.getElementById('formprod').style.display=document.getElementById('formprod').style.display==='none'?'block':'none'" style="background:var(--panel2);border:1px solid var(--line);color:var(--gold);border-radius:8px;padding:6px 14px;font-size:12px;cursor:pointer">+ Novo produto</button>
      <button onclick="if(confirm('Restaurar os 4 produtos originais? Os cadastrados serão perdidos.'))resetProdutos()" style="background:none;border:none;color:var(--dim);font-size:11px;cursor:pointer">restaurar padrão</button>

// ---------- INDICADORES (view) ----------
function sparkline(serie, cor){
  if(!serie || serie.length<2) return "";
  const w=120,h=32,mn=Math.min(...serie),mx=Math.max(...serie),rg=(mx-mn)||1;
  const pts=serie.map((v,i)=>`${(i/(serie.length-1)*w).toFixed(1)},${(h-((v-mn)/rg)*h).toFixed(1)}`).join(" ");
  return `<svg width="${w}" height="${h}" style="display:block;margin-top:8px"><polyline points="${pts}" fill="none" stroke="${cor}" stroke-width="2"/></svg>`;
}
function setMacroManual(k, v){ MACRO[k]={...MACRO[k], valor:parseFloat(v)||0, data:"manual", live:false}; }
function setIbov(v){ window.__ibov = parseFloat(v)||IBOV_MANUAL; }

function vMacro(){
  const ibov = window.__ibov || IBOV_MANUAL;
  const cards = [
    {k:"selic", cor:"var(--gold)"}, {k:"cdi", cor:"var(--sky)"},
    {k:"ipca12", cor:"var(--orange)"}, {k:"ipca_m", cor:"var(--violet)"},
    {k:"dolar", cor:"var(--green)"}, {k:"igpm", cor:"var(--red)"},
  ];
  const fmtVal = (k)=>{
    const m=MACRO[k], s=SGS[k];
    if(s.moeda) return "R$ "+m.valor.toLocaleString("pt-BR",{minimumFractionDigits:4,maximumFractionDigits:4});
    return m.valor.toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2})+s.suf;
  };
  return `
  <div class="card" style="margin-bottom:14px">
    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
      <div class="sec" style="margin:0">Indicadores econômicos — Banco Central do Brasil</div>
      <button onclick="carregaMacro(true)" style="background:var(--panel2);border:1px solid var(--line);color:var(--sky);border-radius:8px;padding:6px 14px;font-size:12px;cursor:pointer">↻ Atualizar do BCB</button>
      <span id="macro_status" class="sub" style="margin-left:auto"></span>
    </div>
  </div>
  <div class="grid g3">
    ${cards.map(({k,cor})=>{
      const m=MACRO[k], s=SGS[k];
      return `<div class="card kpi">
        <div class="lbl">${s.nome} ${m.live?'<span class="pill green" style="font-size:9px">ao vivo</span>':'<span class="pill mut" style="font-size:9px">'+m.data+'</span>'}</div>
        <div class="val" style="color:${cor}">${fmtVal(k)}</div>
        <div class="det">${m.live?"BCB · "+m.data:"clique para editar"}</div>
        ${sparkline(m.serie,cor)}
        <input class="binput" style="margin-top:8px;padding:5px 8px;font-size:12px" value="${m.valor}" onchange="setMacroManual('${k}',this.value);render('macro')">
      </div>`;
    }).join("")}
  </div>
  <div class="grid g2e mt">
    <div class="card kpi">
      <div class="lbl">Ibovespa (pontos) ${window.__ibovVar!=null?'<span class="pill green" style="font-size:9px">brapi ao vivo</span>':'<span class="pill mut" style="font-size:9px">manual</span>'}</div>
      <div class="val" style="color:var(--green)">${ibov.toLocaleString("pt-BR",{maximumFractionDigits:0})} ${window.__ibovVar!=null?`<span class="${cls(window.__ibovVar)}" style="font-size:13px">${window.__ibovVar>=0?"+":""}${fp(window.__ibovVar)}</span>`:""}</div>
      <div class="det">Fonte: brapi.dev (^BVSP) — <span style="cursor:pointer;color:var(--sky)" onclick="buscaIbov()">buscar agora</span></div>
      <input class="binput" style="margin-top:8px;padding:5px 8px;font-size:12px" value="${ibov}" onchange="setIbov(this.value);render('macro')">
    </div>
    <div class="card">
      <div class="sec">Leitura para a mesa</div>
      <div class="pd" style="line-height:1.7">
        ${(()=>{
          const selic=(MACRO.selic&&MACRO.selic.valor!=null)?MACRO.selic.valor:SGS.selic.ref, cdi=(MACRO.cdi&&MACRO.cdi.valor!=null)?MACRO.cdi.valor:SGS.cdi.ref, ipca=(MACRO.ipca12&&MACRO.ipca12.valor!=null)?MACRO.ipca12.valor:SGS.ipca12.ref;
          const jurosReal=(((1+selic/100)/(1+ipca/100))-1)*100;
          const out=[];
          out.push(`• <b>Juro real</b> (Selic vs IPCA): <b style="color:var(--gold)">${jurosReal.toFixed(2)}%</b> — patamar ${jurosReal>6?"muito atrativo":jurosReal>4?"atrativo":"moderado"} para renda fixa e IPCA+.`);

// ---------- roteador ----------
function copiar(ev, txt, feedbackEl){
  if(ev) ev.stopPropagation();
  const done = (el)=>{ if(!el) return; const o=el.textContent; el.textContent="✓"; setTimeout(()=>el.textContent=o,900); };
  const el = feedbackEl || (ev && ev.currentTarget);
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(()=>done(el)).catch(()=>fallbackCopy(txt,el,done));
  } else fallbackCopy(txt,el,done);
}
function fallbackCopy(txt, el, done){
  const ta = document.createElement("textarea");
  ta.value = txt; ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.focus(); ta.select();
  try{ document.execCommand("copy"); done(el); }catch(e){ alert("Código: "+txt); }
  document.body.removeChild(ta);
}

// mapeia a estratégia do XPerformance para as 4 classes do simulador
function classeSim(estrategia, ativo){
  const e = estrategia||"";
  if(e==="Pós Fixado") return "cdi";
  if(e==="Inflação") return "ipca";
  if(e==="Pré Fixado") return "pre";
  // RV Brasil/Global, Fundos Listados (FIIs), Multimercado, Alternativo, RF Global → renda variável/risco
  return "rv";
}

function simularConta(id){
  const c = contas.find(x=>x.conta===id);
  if(!c){ alert("Conta não encontrada."); return; }
  let posicoes = (c.posicoes||[])
    .filter(p=>(p.saldo||0)>0)
    .map(p=>({ name: p.ativo, classe: classeSim(p.estrategia,p.ativo), valor: p.saldo }));
  // fallback: contas sem página de posição detalhada no XPerformance entram pelas estratégias (classes)
  if(!posicoes.length){
    posicoes = (c.estrategias||[])
      .filter(e=>(e.saldo||0)>0)
      .map(e=>({ name: e.nome, classe: classeSim(e.nome, e.nome), valor: e.saldo }));
  }
  render('sim');                 // troca de aba e monta o #simroot
  // aguarda o DOM do simulador existir antes de popular
  setTimeout(()=>{
    if(typeof window.carregarCliente==="function"){
      window.carregarCliente({ nome:"Conta "+c.conta, conta:c.conta, total:c.patrimonio, posicoes });
    }
    window.scrollTo(0,0);
  }, 60);
}
