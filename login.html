<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cockpit de Carteiras — BFR</title>
<style>
  :root{
    --bg:#0B1220; --panel:#111B2E; --line:#1F2E48;
    --txt:#E6EDF7; --mut:#8FA3C0; --gold:#F5C044; --red:#FF6B6B;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg); color:var(--txt);
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .caixa{width:100%; max-width:360px}
  h1{font-size:19px; font-weight:600; letter-spacing:-.02em; margin-bottom:4px}
  h1 span{color:var(--gold)}
  .sub{color:var(--mut); font-size:13px; margin-bottom:26px}
  form{background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:20px}
  label{display:block; font-size:12px; color:var(--mut); margin-bottom:6px}
  input{
    width:100%; padding:10px 12px; margin-bottom:16px; font-size:15px;
    background:#0B1220; color:var(--txt);
    border:1px solid var(--line); border-radius:8px;
  }
  input:focus{outline:2px solid rgba(245,192,68,.5); outline-offset:1px; border-color:var(--gold)}
  button{
    width:100%; padding:11px; font-size:15px; font-weight:600; cursor:pointer;
    background:var(--gold); color:#0B1220; border:none; border-radius:8px;
  }
  button:hover{filter:brightness(1.08)}
  .erro{color:var(--red); font-size:13px; margin-bottom:14px}
  .rodape{color:#5B6E8C; font-size:11px; margin-top:16px; text-align:center}
</style>
</head>
<body>
  <div class="caixa">
    <h1>Cockpit de Carteiras <span>BFR</span></h1>
    <p class="sub">Entre para ver as carteiras.</p>
    <form method="post" action="/login">
      <!--ERRO-->
      <label for="usuario">Usuário</label>
      <input id="usuario" name="usuario" autocomplete="username" autocapitalize="none" autofocus required>
      <label for="senha">Senha</label>
      <input id="senha" name="senha" type="password" autocomplete="current-password" required>
      <button type="submit">Entrar</button>
    </form>
    <p class="rodape">Dados de clientes. Não compartilhe este acesso.</p>
  </div>
</body>
</html>
